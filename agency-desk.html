<title>Reach Theory Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: quiet sidebar (clients are the navigation) + one reading column; sections split by hairlines, no card grid.
   One accent (signal orange, "reach") used only for primary actions and the pace tick. */
:root{
  --bg:#f5f6f7; --surface:#ffffff; --sunk:#eceef1; --ink:#131518; --muted:#6a7078; --line:#e1e4e8;
  --accent:#d9481f; --accent-ink:#ffffff; --good:#17794a; --warn:#a15f00; --bad:#c2302a; --cl:46%;
  --r:12px; --shadow:0 1px 2px rgb(15 20 30 / .04),0 6px 24px -8px rgb(15 20 30 / .08);
  --f:"Geist",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
  --m:"Geist Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1113; --surface:#161a1d; --sunk:#1c2024; --ink:#eceef0; --muted:#9299a1; --line:#262b30;
  --accent:#ff7a4d; --accent-ink:#1a0b05; --good:#53c98b; --warn:#e3a84a; --bad:#ff7d74; --cl:64%; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1113; --surface:#161a1d; --sunk:#1c2024; --ink:#eceef0; --muted:#9299a1; --line:#262b30;
  --accent:#ff7a4d; --accent-ink:#1a0b05; --good:#53c98b; --warn:#e3a84a; --bad:#ff7d74; --cl:64%; color-scheme:dark}

/* Appearance: data-look (resolved light/dark) and data-skin (palette) are set by the page's own picker. */
html:root[data-look="light"]{--bg:#f5f6f7; --surface:#ffffff; --sunk:#eceef1; --ink:#131518; --muted:#6a7078; --line:#e1e4e8; --accent:#d9481f; --accent-ink:#ffffff; --good:#17794a; --warn:#a15f00; --bad:#c2302a; --cl:46%; --shadow:0 1px 2px rgb(15 20 30 / .04),0 6px 24px -8px rgb(15 20 30 / .08); color-scheme:light}
html:root[data-look="dark"]{--bg:#0f1113; --surface:#161a1d; --sunk:#1c2024; --ink:#eceef0; --muted:#9299a1; --line:#262b30; --accent:#ff7a4d; --accent-ink:#1a0b05; --good:#53c98b; --warn:#e3a84a; --bad:#ff7d74; --cl:64%; --shadow:0 1px 2px rgb(0 0 0 / .3); color-scheme:dark}
html:root[data-skin="ink"]{--accent:#2f55f0;--accent-ink:#fff}
html:root[data-skin="ink"][data-look="dark"]{--accent:#8aa2ff;--accent-ink:#0a0d1a}
html:root[data-skin="marigold"]{--bg:#f6f3ec;--surface:#fffdf8;--sunk:#eee8dc;--line:#e4dccd;--muted:#6f675b;--accent:#b86e00;--accent-ink:#fff}
html:root[data-skin="marigold"][data-look="dark"]{--bg:#13100c;--surface:#1b1712;--sunk:#231e17;--line:#2f281e;--muted:#a59a87;--accent:#ffb445;--accent-ink:#1a1206}
html:root[data-skin="emerald"]{--bg:#f2f6f4;--surface:#ffffff;--sunk:#e6eee9;--line:#d9e3dd;--muted:#5f6e67;--accent:#0c7a53;--accent-ink:#fff}
html:root[data-skin="emerald"][data-look="dark"]{--bg:#0c1210;--surface:#131a17;--sunk:#19221e;--line:#233029;--muted:#90a298;--accent:#44d19c;--accent-ink:#04140d}
html:root[data-skin="rose"]{--bg:#f7f4f5;--surface:#ffffff;--sunk:#efe9eb;--line:#e6dde0;--muted:#6f6468;--accent:#c7355f;--accent-ink:#fff}
html:root[data-skin="rose"][data-look="dark"]{--bg:#131012;--surface:#1b1619;--sunk:#231d21;--line:#30272c;--muted:#a3949a;--accent:#ff7ea3;--accent-ink:#1a0710}
html:root[data-skin="slate"]{--bg:#eef0f3;--surface:#fbfcfd;--sunk:#e3e7ec;--line:#d5dbe2;--muted:#5d6672;--accent:#131518;--accent-ink:#fff}
html:root[data-skin="slate"][data-look="dark"]{--bg:#0b0d10;--surface:#13161b;--sunk:#1a1e24;--line:#262c34;--muted:#8f98a4;--accent:#f1f3f5;--accent-ink:#0b0d10}
*{box-sizing:border-box}
[style*="--c1"]{--cc:var(--c1)}
html[data-look="dark"] [style*="--c2"]{--cc:var(--c2)}
body{transition:background .2s;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.5;padding-inline:16px;padding-block:28px 96px}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
h1{font-size:26px;letter-spacing:-.02em;line-height:1.2}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:inherit}
.app{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:210px minmax(0,1fr);gap:56px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 28px);align-self:start;display:flex;flex-direction:column;gap:22px}
.mark{font-family:var(--m);font-size:13px;letter-spacing:-.01em}
.mark span{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav .grp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px 8px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;color:var(--muted)}
.nav button:hover{color:var(--ink);background:var(--sunk)}
.nav button[aria-current="true"]{color:var(--ink);background:var(--sunk);font-weight:500}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .ct{font-family:var(--m);font-size:11px}
main{min-width:0;max-width:760px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--cc,var(--muted));flex:none}
.sub{color:var(--muted);margin-top:4px}
.meta{font-family:var(--m);font-size:12px;color:var(--muted);display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:8px}
.sec{margin-top:20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.sec.flat{background:none;border:0;box-shadow:none;padding:0}
.lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.lab .acts{display:flex;gap:8px;text-transform:none;letter-spacing:0;font-size:13px}
.muted{color:var(--muted)}
.mono{font-family:var(--m);font-variant-numeric:tabular-nums}
.b{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.b:hover{border-color:var(--muted)}
.b.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.b.pri:hover{filter:brightness(1.07)}
.b[disabled]{opacity:.5;cursor:default}
.lnk{all:unset;cursor:pointer;color:var(--accent);font-size:13px;font-weight:500}
.lnk:focus-visible{outline:2px solid var(--accent)}
.x{all:unset;cursor:pointer;color:var(--muted);padding:2px 6px;border-radius:4px;font-size:15px;line-height:1}
.x:hover{color:var(--bad);background:var(--sunk)}
.x:focus-visible{outline:2px solid var(--accent)}
input[type=text],input[type=number],input[type=date],input:not([type]),select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
textarea{width:100%;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--muted);outline:none}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:0}
.items{display:flex;flex-direction:column}
.it{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;padding:11px 0;border-bottom:1px solid var(--line);align-items:center}
.it:last-child{border-bottom:0}
.it .t{min-width:0;overflow-wrap:anywhere}
.it .s{font-size:12px;color:var(--muted);display:flex;gap:4px 12px;flex-wrap:wrap;align-items:center;margin-top:2px}
.it .c{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.it.click{cursor:pointer}
.it.click:hover .t{color:var(--accent)}
.it select{padding:4px 6px;font-size:12px}
.late{color:var(--bad);font-weight:500}
.empty{color:var(--muted);padding:6px 0}
.pill{font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.good{color:var(--good)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}.pill.neutral{color:var(--muted)}
.bar{position:relative;height:4px;background:var(--sunk);border-radius:2px;margin-top:8px}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:2px;background:var(--ink)}
.bar u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--accent);text-decoration:none}
.prog{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:baseline}
.big{font-family:var(--m);font-size:30px;font-weight:500;line-height:1;letter-spacing:-.02em}
.tabs2{display:flex;gap:4px;padding:4px;background:var(--sunk);border-radius:10px;margin-top:20px;overflow-x:auto;scrollbar-width:none}
.tabs2 button{all:unset;cursor:pointer;padding:7px 14px;border-radius:7px;color:var(--muted);white-space:nowrap;transition:background .15s,color .15s}
.tabs2 button:hover{color:var(--ink)}
.tabs2 button[aria-current="true"]{color:var(--ink);background:var(--surface);font-weight:500;box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.tabs2 button:focus-visible{outline:2px solid var(--accent)}
.tabs2 + .sec{margin-top:20px}
.dots{display:inline-flex;gap:3px;align-items:center}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 16px}
.kv dt{color:var(--muted);font-size:13px}
.kv dd{margin:0;overflow-wrap:anywhere}
ul.ls{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
ul.ls li{padding-left:2px}
.form{display:grid;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.form label>input,.form label>select,.form label>textarea{color:var(--ink);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.out{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;line-height:1.6}
.out b{font-weight:600}
.drop{border:1px dashed var(--muted);border-radius:8px;padding:18px;text-align:center;color:var(--muted);background:var(--surface)}
.drop.on{border-color:var(--accent);color:var(--ink)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs figure{margin:0;position:relative;width:84px;height:84px;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:var(--sunk)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs .x{position:absolute;top:2px;right:2px;background:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--m);font-size:12px;padding:2px 8px;border-radius:4px;background:var(--sunk)}
.chip b{font-weight:500}
.ins{padding:16px 0;border-bottom:1px solid var(--line);display:grid;gap:10px}
.ins:last-child{border-bottom:0}
.ins h3{font-size:15px}
.chat{display:flex;flex-direction:column;gap:12px;margin-bottom:12px}
.msg{max-width:92%;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}
.msg.u{align-self:flex-end;background:var(--sunk);padding:8px 12px;border-radius:10px 10px 2px 10px}
.msg.a{align-self:flex-start}
.check{display:flex;gap:10px;align-items:flex-start;padding:7px 0}
.check input{margin-top:3px;accent-color:var(--accent)}
.check.done span{color:var(--muted);text-decoration:line-through}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;min-width:480px}
.tbl th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl input{width:100%}
.ev{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev .dd{font-family:var(--m);font-size:12px;color:var(--muted);line-height:1.3}
.ev .dd b{display:block;font-size:20px;color:var(--ink);font-weight:500}
.ev.past{opacity:.45}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 80px);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:9;max-width:calc(100vw - 32px);font-size:13px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.stats > div{padding:14px 18px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0}
.stats > div:first-child{border-left:0}
.stats b{font-family:var(--m);font-size:24px;font-weight:500;line-height:1.1;letter-spacing:-.02em}
.stats b small{font-size:14px;color:var(--muted);font-weight:400}
.stats span{font-size:12px;color:var(--muted)}
.stats .hot b{color:var(--bad)}
.alert{margin-top:16px;display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;padding:11px 16px;border-radius:10px;border:1px solid color-mix(in srgb,var(--bad) 35%,transparent);background:color-mix(in srgb,var(--bad) 9%,var(--surface));color:var(--bad);font-weight:500}
.alert.warn{border-color:color-mix(in srgb,var(--warn) 35%,transparent);background:color-mix(in srgb,var(--warn) 10%,var(--surface));color:var(--warn)}
.hero{margin:-4px 0 0;padding:22px 22px 18px;border-radius:var(--r);border:1px solid color-mix(in srgb,var(--cc) 30%,var(--line));background:linear-gradient(135deg,color-mix(in srgb,var(--cc) 14%,var(--surface)),var(--surface) 70%)}
.mini{height:3px;background:var(--sunk);border-radius:2px;margin-top:8px;max-width:240px;position:relative}
.mini i{position:absolute;inset:0 auto 0 0;border-radius:2px;background:var(--cc)}
.k{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--sunk);color:var(--muted)}
select[data-s]{font-weight:500}
select[data-s="editing"]{border-color:color-mix(in srgb,var(--accent) 50%,var(--line));color:var(--accent)}
select[data-s="sent"]{border-color:color-mix(in srgb,var(--warn) 50%,var(--line));color:var(--warn)}
select[data-s="approved"],select[data-s="done"]{border-color:color-mix(in srgb,var(--good) 50%,var(--line));color:var(--good)}
.look{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.look .grp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{all:unset;cursor:pointer;width:22px;height:22px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgb(0 0 0 / .12);position:relative}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.sw button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.seg{display:inline-flex;background:var(--sunk);border-radius:8px;padding:3px;gap:2px}
.seg button{all:unset;cursor:pointer;padding:4px 10px;border-radius:6px;font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.seg button:focus-visible{outline:2px solid var(--accent)}
.b,.it,.nav button,.lnk{transition:background .15s,color .15s,border-color .15s}
.it.click:hover{background:color-mix(in srgb,var(--sunk) 60%,transparent);margin-inline:-20px;padding-inline:20px}

.badge{background:var(--bad);color:var(--surface);border-radius:99px;padding:0 6px;font-size:11px;line-height:17px}
.prefs{border-top:1px solid var(--line);padding-top:12px;font-size:13px}
.prefs summary{cursor:pointer;color:var(--ink);list-style:none;padding:4px 8px;border-radius:6px}
.prefs summary::-webkit-details-marker{display:none}
.prefs summary:hover{background:var(--sunk)}
.prefs[open] summary{margin-bottom:10px}
.prefs .look{border-top:0;padding:0 8px}
.whoami{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);padding:0 8px 12px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.eyebrow{margin:0 0 6px;font-size:12px;color:var(--muted);letter-spacing:.01em}
.pdot{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.pdot.good{background:var(--good)}.pdot.warn{background:var(--warn)}.pdot.bad{background:var(--bad)}
.count{display:inline-flex;align-items:center;gap:8px;font-size:13px}
.clamp{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.evrow{display:flex;gap:14px;align-items:flex-start}
.when{display:flex;flex-direction:column;align-items:center;min-width:40px;font-size:11px;color:var(--muted);text-transform:uppercase;line-height:1.2}
.when b{font-size:18px;color:var(--ink);font-weight:500}
.cbtn{all:unset;cursor:pointer;font-size:12px;color:var(--muted);border-bottom:1px dotted currentColor}
.cbtn:hover{color:var(--ink)}
.cbtn.need{color:var(--bad);font-weight:500}
.cbtn:focus-visible{outline:2px solid var(--accent)}
.lastc{font-size:12.5px;color:var(--muted);margin-top:5px;padding-left:10px;border-left:2px solid var(--line);overflow-wrap:anywhere}
.lastc b{font-weight:500;color:var(--ink)}
.thread{grid-column:1 / -1;display:flex;flex-direction:column;gap:10px;background:var(--sunk);border-radius:10px;padding:12px 14px;margin-top:6px}
.thread .cm{font-size:13px;overflow-wrap:anywhere}
.thread .cm b{font-weight:500}
.thread input[type=date]{flex:0 0 auto}
.it.is-late{box-shadow:inset 3px 0 0 var(--bad);padding-left:12px}

/* ---- v7: navigation, board, grid, followers, report ---- */
main.wide{max-width:none}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.search{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--muted);font-size:13px}
.search:hover{border-color:var(--muted);color:var(--ink)}
.search:focus-visible{outline:2px solid var(--accent)}
.search span{flex:1}
kbd{font-family:var(--m);font-size:10.5px;padding:1px 5px;border:1px solid var(--line);border-radius:4px;color:var(--muted);background:var(--sunk)}
.nav button{padding:7px 10px}
.nav button[aria-current="true"]{background:var(--surface);box-shadow:0 1px 2px rgb(0 0 0 / .06),inset 0 0 0 1px var(--line)}
.nav .grp{display:flex;justify-content:space-between;align-items:center;margin-right:4px}
.addc{all:unset;cursor:pointer;color:var(--muted);border-radius:5px;padding:2px;display:flex}
.addc:hover{color:var(--accent);background:var(--sunk)}
.addc:focus-visible{outline:2px solid var(--accent)}
.crumb{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:10px}
.crumb .lnk{font-weight:400}
.stat{all:unset;box-sizing:border-box;cursor:pointer;padding:14px 18px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0;transition:background .15s}
.stats > .stat:first-child{border-left:0}
.stat:hover{background:var(--sunk)}
.stat:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.stat .arr{opacity:0;transition:opacity .15s;color:var(--accent)}
.stat:hover .arr,.stat:focus-visible .arr{opacity:1}
button.alert{all:unset;box-sizing:border-box;cursor:pointer;margin-top:16px;display:flex;width:100%;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;padding:11px 16px;border-radius:10px;border:1px solid color-mix(in srgb,var(--bad) 35%,transparent);background:color-mix(in srgb,var(--bad) 9%,var(--surface));color:var(--bad);font-weight:500}
button.alert:hover{background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
button.alert:focus-visible{outline:2px solid var(--accent)}

.s-editing{background:var(--accent)}.s-sent{background:var(--warn)}.s-approved,.s-done{background:var(--good)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;cursor:grab;box-shadow:0 1px 2px rgb(0 0 0 / .04)}

.gridwrap{overflow-x:auto}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(96px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:680px}
.gh{background:var(--sunk);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 8px}
.cell{background:var(--surface);min-height:104px;padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0}

.dn{font-family:var(--m);font-size:12px;color:var(--muted)}

.gchip{all:unset;box-sizing:border-box;cursor:pointer;font-size:11px;line-height:1.3;padding:2px 6px;border-radius:5px;background:color-mix(in srgb,var(--cc,var(--muted)) 16%,var(--surface));border-left:3px solid var(--cc,var(--muted));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

.chartwrap{position:relative}
.chart{width:100%;height:auto;display:block;touch-action:none}
.ftip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:7px;line-height:1.35;white-space:nowrap}

.tl{display:flex;flex-direction:column;gap:14px;border-left:2px solid var(--line);margin-left:5px;padding-left:18px}

.proposal{background:color-mix(in srgb,var(--accent) 6%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 25%,var(--line));border-radius:10px;padding:14px 16px;margin-bottom:14px}
.k.ask{background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--accent)}

.gen{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sk{display:block;height:12px;border-radius:6px;margin:8px 0;background:linear-gradient(90deg,var(--sunk),color-mix(in srgb,var(--sunk) 40%,var(--surface)),var(--sunk));background-size:200% 100%;animation:sk 1.2s ease-in-out infinite}

@media (prefers-reduced-motion:reduce){.sk{animation:none}}
.cmdk{position:fixed;inset:0;z-index:20;background:rgb(10 12 16 / .38);display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px}

/* report: always light, fixed palette so the PDF looks the same for every viewer */
.repwrap{overflow:hidden;margin-top:18px;padding:18px;background:var(--sunk);border-radius:var(--r)}

.rep-sm{font-size:11.5px;color:#6b6f76;line-height:1.5}
.rep-m{font-size:16px;font-weight:600;color:#16181c}
.rep-client{margin:26px 0 8px}
.rep-cn{font-size:30px;font-weight:600;letter-spacing:-.02em;color:#16181c;line-height:1.15}
.rep-h{font-size:19px;font-weight:600;margin:22px 0 6px;color:#16181c}

/* ---- v8: report editor ---- */
.mark.home{all:unset;cursor:pointer;display:block;font-family:var(--m);font-size:13px;border-radius:6px;padding:2px 4px;margin:-2px -4px}

/* ---- v9: studio review ---- */

/* ---- v10: client cards ---- */
.ccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:16px;margin-top:20px}

.cc-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}

.cc-kpis b small{font-size:11px;color:var(--muted)}
.cc-kpis span{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.cc-foot{display:flex;justify-content:space-between;gap:10px;font-family:var(--m);font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}

.prow2{position:relative;padding-left:16px !important}
.prow2::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--cc)}

/* ---- v12: calendar day panel ---- */
button.cell{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);min-height:108px;padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0;transition:background .12s}

.dnrow{display:flex;justify-content:space-between;align-items:center}

span.gchip{cursor:inherit;display:block}
.more{font-size:11px;color:var(--muted);padding-left:2px}
.daypanel{border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.evnote{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:8px;background:var(--sunk);margin-bottom:10px;font-size:13px}

.genprog{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:13px;color:var(--muted)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---- v14: campaigns ---- */
.camb{border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.phases{position:relative;height:46px;margin-top:16px;border-radius:8px;background:var(--sunk);overflow:hidden}
.ph{position:absolute;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;padding:0 8px;background:color-mix(in srgb,var(--cc,var(--accent)) calc(var(--o) * 100%),var(--surface));border-right:2px solid var(--surface);min-width:0;overflow:hidden}

.thumbs.sm figure{width:56px;height:56px}

.bk{display:flex;flex-direction:column;gap:6px;padding:0 8px 14px;border-bottom:1px solid var(--line);margin-bottom:12px}

.impact{grid-column:1/-1;margin-top:8px;padding:12px 14px;border-radius:10px;background:color-mix(in srgb,var(--accent) 5%,var(--sunk));border:1px solid color-mix(in srgb,var(--accent) 20%,var(--line));display:flex;flex-direction:column;gap:8px}

.imptag{flex:none;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--sunk);white-space:nowrap}
.imptag.change{color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,var(--surface))}

function splitTitle(txt){
  const t = String(txt || '').trim();
  if (t.length <= 72) return [t, ''];
  let best = -1, len = 0;
  for (const sep of [' — ', ' – ', ': ', '; ', '. ', ' - ', ', ']){ const k = t.indexOf(sep, 24); if (k > 0 && k <= 90 && (best < 0 || k < best)){ best = k; len = sep.length; } }
  if (best > 0) return [t.slice(0, best).replace(/[,:;.]$/, ''), t.slice(best + len).trim()];
  const cut = t.lastIndexOf(' ', 64); const k = cut > 30 ? cut : 64;
  return [t.slice(0, k) + '…', '…' + t.slice(k).trim()];
}

const BK_COLS = ['clients','tasks','team','insights','prompts','reports','campaigns'];
function backupAge(){ const at = S.backup?.at; if (!at) return 'Never backed up'; const d = daysSince(at); return 'Last backup ' + (d === 0 ? 'today' : d === 1 ? 'yesterday' : d + ' days ago'); }
function backupNudge(){

async function doBackup(){
  if (!downloads){ toast('Downloads aren’t available in this view. Open the desk in claude.ai in a browser.'); return; }
  ui.busy.backup = true; render();
  try {
    const data = {};
    for (const col of BK_COLS){ const snap = await db.collection(col).get(); data[col] = snap.docs.map(d => ({id:d.id, ...d.data()})); }
    const images = [...new Set([...data.insights.flatMap(i => i.assets || []), ...data.clients.flatMap(c => (c.asks || []).flatMap(a => a.imgs || []))])];
    const file = {app:'Reach Theory Desk', version:1, exportedAt:new Date().toISOString(), counts:Object.fromEntries(BK_COLS.map(c => [c, data[c].length])), note:'Images stay inside the desk; imageIds lists them.', imageIds:images, data};
    await downloads.save({filename:`reach-story-desk-backup-${today}.json`, data:new Blob([JSON.stringify(file, null, 1)], {type:'application/json'})});
    await write(() => db.doc('meta/backup').set({at:Date.now(), by:myMember || '', counts:file.counts}));
    toast('Backup downloaded');
  } catch(e){ toast(e && e.code === 'declined' ? 'Backup cancelled' : 'Couldn’t make the backup. Try again.'); }
  ui.busy.backup = false; render();
}
function restorePanel(){
  const r = ui.restore; if (!r) return '';
  return `<div class="sec" style="border-color:color-mix(in srgb,var(--accent) 35%,var(--line))"><div class="lab">Restore from backup<span class="acts"><button class="x" data-act="restoreCancel" aria-label="Cancel">×</button></span></div>
    ${r.error ? `<p class="late" style="margin:0">${esc(r.error)}</p>` : `<p style="margin:0 0 10px">Backup from <b style="font-weight:600">${esc(new Date(r.exportedAt).toLocaleString())}</b>. Restoring only adds records that are missing now. Nothing that exists is changed or deleted.</p>
    <div class="chips" style="margin-bottom:12px">${BK_COLS.map(c => `<span class="chip">${esc(c)} <b>${r.missing[c].length}</b> missing</span>`).join('')}</div>
    ${r.total ? `<button class="b pri" data-act="restoreGo" ${ui.busy.restore ? 'disabled' : ''}>${ui.busy.restore ? 'Restoring…' : `Restore ${r.total} missing record${r.total === 1 ? '' : 's'}`}</button>` : '<p class="empty">Nothing is missing. Your desk already has everything in this backup.</p>'}`}</div>`;
}
async function readBackupFile(f){
  let j; try { j = JSON.parse(await f.text()); } catch(e){ ui.restore = {error:'That file isn’t a desk backup. Choose a reach-story-desk-backup-….json file.'}; go('today'); return; }
  if (!j || j.app !== 'Reach Theory Desk' || !j.data){ ui.restore = {error:'That file isn’t a desk backup. Choose a reach-story-desk-backup-….json file.'}; go('today'); return; }
  const have = {clients:S.allClients, tasks:S.tasks, team:S.team, insights:S.insights, prompts:S.prompts, reports:S.reports, campaigns:S.campaigns};
  const missing = {}; let total = 0;
  for (const c of BK_COLS){ const ids = new Set((have[c] || []).map(x => x.id)); missing[c] = (j.data[c] || []).filter(x => x && x.id && !ids.has(x.id)); total += missing[c].length; }
  ui.restore = {exportedAt:j.exportedAt, missing, total}; go('today');
}
async function doRestore(){
  const r = ui.restore; if (!r || !r.total) return;
  ui.busy.restore = true; render(); let n = 0;
  try { for (const c of BK_COLS) for (const x of r.missing[c]){ const {id, ...body} = x; await db.collection(c).doc(id).set(body); n++; } toast(`Restored ${n} record${n === 1 ? '' : 's'}`); ui.restore = null; }
  catch(e){ toast(`Restored ${n}, then stopped: ${e && e.code === 'quota_exceeded' ? 'storage is full' : 'a write failed'}. Try again to finish.`); }
  ui.busy.restore = false; render();
}
function liveCampaigns(){
  const list = S.campaigns.filter(x => x.status !== 'done' && x.start && x.end && daysTo(x.start) <= 14 && today <= x.end);

function calList(){
  let last = '';
  return `<div class="sec">${EVENTS.map(e => { const m = new Date(e.d+'T00:00:00').toLocaleDateString(undefined,{month:'long', year:'numeric'}); const head = m !== last ? `<div class="lab" style="margin-top:${last ? 22 : 0}px">${esc(m)}</div>` : ''; last = m; const dt = daysTo(e.d);
    return head + `<div class="ev ${dt < 0 ? 'past' : ''}"><div class="dd"><b>${new Date(e.d+'T00:00:00').getDate()}</b>${esc(new Date(e.d+'T00:00:00').toLocaleDateString(undefined,{weekday:'short'}))}</div>
      <div><div class="row" style="justify-content:space-between"><b style="font-weight:500">${esc(e.name)}</b><span class="mono muted" style="font-size:12px">${dt < 0 ? 'passed' : dt === 0 ? 'today' : 'in ' + dt + ' days'}</span></div>

      ${dt >= 0 ? `<div class="row" style="margin-top:6px;gap:8px"><span class="muted" style="font-size:12px">Build campaign for:</span>${e.who.map(id => C(id) ? `<button class="lnk" style="font-size:12px" data-act="newCampaignFor" data-cid="${esc(id)}" data-ev="${esc(e.d)}">${esc(C(id).name)}</button>` : '').join('')}</div>` : ''}</div></div>`; }).join('')}
  <p class="muted" style="font-size:12px;margin-top:14px">Lunar dates can shift by a day. Check the local panchang for Lohri and Dev Uthani.</p></div>`;
}
function calGrid(){
  const base = new Date(now.getFullYear(), now.getMonth() + (ui.calOff || 0), 1);
  const y = base.getFullYear(), m = base.getMonth(), days = new Date(y, m + 1, 0).getDate();
  const lead = (base.getDay() + 6) % 7;
  const sel = ui.calDay && ui.calDay.slice(0, 7) === `${y}-${pad(m+1)}` ? ui.calDay : null;
  const cells = [];
  for (let i = 0; i < lead; i++) cells.push('<div class="cell off"></div>');
  for (let d = 1; d <= days; d++){
    const ds = `${y}-${pad(m+1)}-${pad(d)}`;
    const evs = EVENTS.filter(e => e.d === ds), ts = S.tasks.filter(t => t.due === ds).sort((a,b) => (a.status === 'done') - (b.status === 'done'));
    const late = ts.filter(t => t.status !== 'done' && ds < today).length;
    const chips = [...evs.map(e => `<span class="gchip ev">${esc(e.name)}</span>`), ...ts.map(t => `<span class="gchip ${t.status === 'done' ? 'done' : ''}" style="${hueStyle(C(t.client))}">${esc(t.title)}</span>`)];
    cells.push(`<button class="cell ${ds === today ? 'now' : ''} ${ds < today ? 'pastd' : ''} ${ds === sel ? 'sel' : ''}" data-day="${ds}" aria-label="${esc(fmt(ds))}: ${ts.length} task${ts.length === 1 ? '' : 's'}${evs.length ? ', ' + evs.map(e => e.name).join(', ') : ''}">
      <span class="dnrow"><span class="dn">${d}</span>${ts.length ? `<span class="dcount ${late ? 'late' : ''}">${ts.length}</span>` : ''}</span>${chips.slice(0, 3).join('')}${chips.length > 3 ? `<span class="more">+${chips.length - 3} more</span>` : ''}</button>`);
  }
  const undated = openTasks().filter(t => !t.due);
  return `<div class="sec"><div class="row" style="justify-content:space-between;margin-bottom:12px"><b style="font-weight:600;font-size:16px">${esc(base.toLocaleDateString(undefined,{month:'long', year:'numeric'}))}</b>
    <div class="row"><button class="b" data-act="calPrev" aria-label="Previous month">‹</button><button class="b" data-act="calNow">This month</button><button class="b" data-act="calNext" aria-label="Next month">›</button></div></div>
    <div class="gridwrap"><div class="grid7">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d => `<div class="gh">${d}</div>`).join('')}${cells.join('')}</div></div>
    <p class="muted" style="font-size:12px;margin:10px 0 0">Click a date to see and add its tasks. Coloured chips are tasks in each client’s colour. Grey chips are festive moments.</p></div>
  ${sel ? dayPanel(sel) : ''}
  <div class="sec"><div class="lab">No date yet<span class="acts muted">${undated.length} open task${undated.length === 1 ? '' : 's'}</span></div>
    ${undated.length ? `<div class="items">${undated.slice(0, 30).map(t => { const c = C(t.client); return `<div class="it" data-tid="${esc(t.id)}"><div><div class="t">${esc(t.title)}</div><div class="s"><span>${dot(c)} ${esc(c ? c.name : t.clientName || '')}</span><span class="k">${esc(SHORT[t.kind] || t.kind)}</span></div></div>
      <div class="c"><label class="vh" for="sd-${esc(t.id)}">Due date</label><input type="date" id="sd-${esc(t.id)}" data-change="schedule" value="${esc(sel || '')}"></div></div>`; }).join('')}</div>` : '<p class="empty">Every open task has a date.</p>'}</div>`;
}
function dayPanel(ds){

/* ----- Tasks ----- */
function presetMatch(t){
  const p = ui.filt.preset;
  if (p === 'overdue') return t.status !== 'done' && t.due && t.due < today;
  if (p === 'sent') return t.status === 'sent';
  if (p === 'open') return t.status !== 'done';
  if (p === 'today') return t.status !== 'done' && t.due === today;
  if (p === 'week') return t.status !== 'done' && t.due && t.due >= today && daysTo(t.due) <= 7;
  if (p === 'unassigned') return t.status !== 'done' && !t.assignee;
  return true;
}
const PRESETS = {overdue:'Overdue', sent:'With client', open:'Open', today:'Due today', week:'This week', unassigned:'Unassigned'};
function viewTasks(){
  const f = ui.filt, board = ui.taskView === 'board';
  const list = S.tasks.filter(t => presetMatch(t) && (board || f.done || f.preset || t.status !== 'done') && (!f.client || t.client === f.client) && (!f.who || (f.who === 'none' ? !t.assignee : t.assignee === f.who)))
    .filter(t => !board || t.status !== 'done' || t.doneMonth === monthKey)
    .sort((a,b) => (a.due || '9999').localeCompare(b.due || '9999'));
  return `<header class="top"><div><p class="eyebrow">To do → editing → with client → approved → done</p><h1>Tasks</h1></div>

  ${(() => { const op = S.tasks.filter(t => t.status !== 'done');
    const q = [['overdue','Overdue', op.filter(t => t.due && t.due < today).length, 'bad'], ['today','Today', op.filter(t => t.due === today).length, 'warn'], ['week','This week', op.filter(t => t.due && t.due >= today && daysTo(t.due) <= 7).length, ''], ['sent','With client', op.filter(t => t.status === 'sent').length, ''], ['unassigned','Unassigned', op.filter(t => !t.assignee).length, '']];
    return `<div class="quick">${q.map(([k,l,n,cl]) => `<button class="qchip ${cl} ${f.preset === k ? 'on' : ''}" data-act="${f.preset === k ? 'clearPreset' : 'quick'}" data-q="${k}" aria-pressed="${f.preset === k}"><b>${n}</b>${l}</button>`).join('')}</div>`; })()}
  <div class="sec toolbar">
    <div class="row" style="justify-content:space-between;gap:10px">
      <button class="b ${ui.addOpen ? '' : 'pri'}" data-act="toggleAdd">${ui.addOpen ? 'Close' : ico('plus') + ' New task'}</button>
      <div class="row" style="gap:8px">
        <label class="vh" for="f-client">Client</label><select id="f-client" data-change="filt" data-k="client"><option value="">All pages</option>${S.clients.map(c => `<option value="${esc(c.id)}"${c.id===f.client?' selected':''}>${esc(c.name)}</option>`).join('')}</select>

// Ask Claude for one JSON object per line and hand each over as soon as its line is complete.
async function streamItems(prompt, key, onItem){
  const ctl = new AbortController(); ui.ctl[key] = ctl;
  let pending = '', n = 0;
  const eat = line => { line = line.trim().replace(/^```\w*|```$/g, '').replace(/^[-*]\s+/, '').replace(/,\s*$/, ''); if (!line.startsWith('{')) return; try { const o = JSON.parse(line); if (onItem(o) !== false) n++; schedule(); } catch(e){} };
  const {text} = await sample(prompt + '\n\nOUTPUT FORMAT: one complete JSON object per line (NDJSON). No array brackets, no code fences, no other text. Write the most useful item first.', {cache:false, signal:ctl.signal,
    onText:({delta}) => { const lines = (pending + delta).split('\n'); pending = lines.pop(); lines.forEach(eat); }});
  eat(pending);
  if (!n){ try { const m = text.match(/\[[\s\S]*\]/); if (m) JSON.parse(m[0]).forEach(o => { if (onItem(o) !== false) n++; }); } catch(e){} }
  return n;
}

const folSorted = c => (c.followers || []).filter(x => x && x.d && Number.isFinite(Number(x.n))).map(x => ({d:x.d, n:Number(x.n)})).sort((a,b) => a.d.localeCompare(b.d));
function folStats(f){
  if (!f.length) return null;
  const last = f.at(-1), first = f[0];
  const cut = iso(new Date(new Date(last.d + 'T00:00:00') - 30 * 864e5));
  const base30 = [...f].reverse().find(x => x.d <= cut) || first;
  const spanW = Math.max(1, (new Date(last.d) - new Date(first.d)) / (7 * 864e5));
  const perWeek = f.length > 1 ? (last.n - first.n) / spanW : 0;

}
function chartSvg(f, opts = {}){

  const X = t => L + (t - x0) / (x1 - x0) * (W - L - R), Y = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  const pts = f.map((p, i) => [X(xs[i]), Y(p.n)]);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = line + ` L${pts.at(-1)[0].toFixed(1)} ${H - B} L${pts[0][0].toFixed(1)} ${H - B} Z`;
  const ticks = [0, 1, 2, 3].map(i => y0 + (y1 - y0) * i / 3);
  const ink = opts.ink || 'var(--muted)', grid = opts.grid || 'var(--line)', col = opts.color || 'var(--cc)', surf = opts.surface || 'var(--surface)';
  const xl = [f[0], f[Math.floor((f.length - 1) / 2)], f.at(-1)].filter((p, i, a) => a.indexOf(p) === i);
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Followers from ${esc(fmt(f[0].d))} to ${esc(fmt(f.at(-1).d))}: ${fmtN(f[0].n)} to ${fmtN(f.at(-1).n)}" data-pts='${esc(JSON.stringify(f.map((p, i) => [pts[i][0], pts[i][1], p.d, p.n])))}'>
    ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="${grid}" stroke-width="1"/><text x="${L - 8}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="${ink}" font-family="Geist Mono, monospace">${fmtN(Math.round(v))}</text>`).join('')}
    ${xl.map(p => { const x = X(new Date(p.d + 'T00:00:00').getTime()); return `<text x="${x.toFixed(1)}" y="${H - 8}" text-anchor="${x < L + 30 ? 'start' : x > W - R - 30 ? 'end' : 'middle'}" font-size="11" fill="${ink}">${esc(fmt(p.d))}</text>`; }).join('')}
    <path d="${area}" fill="${col}" fill-opacity=".10" stroke="none"/>
    <path d="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="4.5" fill="${col}" stroke="${surf}" stroke-width="2"/>
    ${opts.static ? '' : `<line class="xh" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="${ink}" stroke-width="1" stroke-dasharray="3 3" opacity="0"/><circle class="hp" r="5" fill="${col}" stroke="${surf}" stroke-width="2" opacity="0"/><rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent" class="hit"/>`}
  </svg>`;
}
function wireChart(){
  const svg = document.querySelector('.chart'); if (!svg || !svg.dataset.pts) return;
  const pts = JSON.parse(svg.dataset.pts), tip = document.getElementById('ftip'), xh = svg.querySelector('.xh'), hp = svg.querySelector('.hp');
  const move = ev => {
    const r = svg.getBoundingClientRect(), vx = (ev.clientX - r.left) / r.width * svg.viewBox.baseVal.width;
    const p = pts.reduce((a, b) => Math.abs(b[0] - vx) < Math.abs(a[0] - vx) ? b : a);
    xh.setAttribute('x1', p[0]); xh.setAttribute('x2', p[0]); xh.setAttribute('opacity', '.6');
    hp.setAttribute('cx', p[0]); hp.setAttribute('cy', p[1]); hp.setAttribute('opacity', '1');
    tip.hidden = false; tip.innerHTML = `<b>${fmtN(p[3])}</b> followers<br><span>${esc(fmt(p[2]))}</span>`;
    const px = p[0] / svg.viewBox.baseVal.width * r.width, py = p[1] / svg.viewBox.baseVal.height * r.height;
    tip.style.left = Math.min(r.width - 120, Math.max(0, px + 10)) + 'px'; tip.style.top = Math.max(0, py - 44) + 'px';
  };
  const hit = svg.querySelector('.hit');
  hit.addEventListener('pointermove', move); hit.addEventListener('pointerdown', move);
  hit.addEventListener('pointerleave', () => { tip.hidden = true; xh.setAttribute('opacity', '0'); hp.setAttribute('opacity', '0'); });
}

const num = v => { if (typeof v === 'number') return v; const m = String(v ?? '').replace(/[,₹$\s]/g, '').match(/^(-?[\d.]+)([kKmM])?/); if (!m) return NaN; return Number(m[1]) * (m[2] ? (/k/i.test(m[2]) ? 1e3 : 1e6) : 1); };

function campState(x){
  if (x.status === 'done') return ['good', 'Done'];
  if (!x.start) return ['neutral', 'Draft'];
  if (today < x.start) return ['warn', `Starts in ${daysTo(x.start)}d`];
  if (x.end && today > x.end) return ['neutral', 'Ended · debrief'];
  return ['bad', `Live · ${x.end ? daysTo(x.end) + 'd left' : ''}`];
}
const campTasks = x => S.tasks.filter(t => t.campaign === x.id);

async function buildCampaign(x){
  const c = C(x.client), key = 'camp:' + x.id;
  ui.busy[key] = true; ui.t0[key] = Date.now(); delete ui.out[key];
  ui.campLive[x.id] = {brief:null, items:[]}; render();
  try {
    await streamItems(campPrompt(x, c), key, o => {
      if (o.type === 'brief'){ ui.campLive[x.id].brief = o; return; }
      if (o.type === 'item' && o.title){ ui.campLive[x.id].items.push({date:/^\d{4}-\d\d-\d\d$/.test(o.date) ? o.date : '', phase:String(o.phase || ''), channel:CH[o.channel] ? o.channel : 'ig_post', title:String(o.title), hook:String(o.hook || ''), copy:String(o.copy || ''), visual:String(o.visual || ''), need:String(o.need || ''), assignee:String(o.assignee || '')}); return; }
      return false;
    });
    const L = ui.campLive[x.id];
    if (!L.items.length && !L.brief) throw {code:'invalid_json'};
    const b = L.brief || {};
    const patch = {brief:{bigIdea:String(b.bigIdea || ''), audience:String(b.audience || ''), offerAngle:String(b.offerAngle || ''), kpi:String(b.kpi || ''), hashtags:String(b.hashtags || ''),
      phases:(b.phases || []).map(p => ({name:String(p.name || ''), start:String(p.start || ''), end:String(p.end || ''), goal:String(p.goal || '')})), budget:(b.budget || []).map(p => ({phase:String(p.phase || ''), amount:String(p.amount || ''), objective:String(p.objective || ''), targeting:String(p.targeting || '')}))},
      items:L.items.slice(0, 30), builtAt:Date.now()};
    if (!x.name && b.name) patch.name = String(b.name);
    if (!x.start && patch.brief.phases[0]?.start) patch.start = patch.brief.phases[0].start;
    if (!x.end && patch.brief.phases.at(-1)?.end) patch.end = patch.brief.phases.at(-1).end;
    await write(() => db.collection('campaigns').doc(x.id).update(patch), 'Campaign saved');
    delete ui.campLive[x.id];
  } catch(e){ if (!(e && e.code === 'cancelled')) ui.out[key] = errCopy(e); }
  ui.busy[key] = false; render();
}
function phaseBar(x){
  const ph = (x.brief?.phases || []).filter(p => p.start && p.end);
  if (!ph.length) return '';
  const ds = [x.start, x.end, ...ph.flatMap(p => [p.start, p.end])].filter(Boolean).sort();
  const t0 = new Date(ds[0] + 'T00:00:00').getTime(), t1 = new Date(ds.at(-1) + 'T00:00:00').getTime() + 864e5, span = Math.max(864e5, t1 - t0);
  const pos = d => Math.min(100, Math.max(0, (new Date(d + 'T00:00:00').getTime() - t0) / span * 100));
  const tn = Date.now(), tp = (tn - t0) / span * 100;
  return `<div class="phases">${ph.map((p, i) => `<div class="ph" style="left:${pos(p.start)}%;width:${Math.max(4, pos(p.end) + 100 / (span / 864e5) - pos(p.start))}%;--o:${.18 + i * .14}"><b>${esc(p.name)}</b><span>${esc(fmt(p.start))}</span></div>`).join('')}
    ${tp >= 0 && tp <= 100 ? `<i class="phnow" style="left:${tp}%"><span>today</span></i>` : ''}</div>`;
}

async function campToTasks(x, only){

  for (const i of idx){ const it = x.items[i];
    const who = S.team.find(m => m.name.toLowerCase() === String(it.assignee || '').toLowerCase())?.id || (['ig_reel','ig_carousel','ig_post','ig_story'].includes(it.channel) ? (S.team.find(m => m.role === 'editor')?.id || '') : '');

}

    const pm = prevMonth(monthKey), pr = repDoc(c, pm);
    const hadPrev = S.tasks.some(t => t.client === c.id && t.doneMonth === pm) || S.insights.some(i => i.client === c.id && insMonth(i) === pm) || folSorted(c).some(x => x.d.slice(0,7) === pm);

    if (li > 30) add('Data and learning', 2, `No insights for ${c.name} ${li === Infinity ? 'yet' : 'in ' + li + ' days'}`, 'Without screenshots, ideas and plans are guesses and the report has no numbers.', {go:'client', cid:c.id, tab:'insights', l:'Add screenshot'}, 'noins', c.name);
    if (lf > 30) add('Data and learning', 1, `No follower count for ${c.name} ${lf === Infinity ? 'yet' : 'in ' + lf + ' days'}`, 'Growth you can’t show is growth the client can’t see.', {go:'client', cid:c.id, tab:'followers', l:'Log count'}, 'nofol', c.name);
    const loc = c.local?.items || [];
    if (loc.length){ const p = loc.filter(i => i.done).length / loc.length * 100; area['Growth work'].push(p); if (p < 50) add('Growth work', 1, `${c.name}: local presence ${Math.round(p)}% set up`, 'Google profile, reviews and WhatsApp setup bring walk-ins that Instagram alone doesn’t.', {go:'client', cid:c.id, tab:'growth', l:'Open checklist'}, 'local', c.name); }
    if (hasBudget(c)){ const adIns = S.insights.some(i => i.client === c.id && /Ads|Meta/i.test(i.type) && daysSince(i.createdAt) <= 30); area['Growth work'].push(adIns ? 100 : 30);
      if (!adIns) add('Growth work', 2, `${c.name} spends ${c.ads.budget} on ads with no results tracked`, 'Paid money with no numbers is the first thing a client questions. Add an Ads Manager screenshot.', {go:'client', cid:c.id, tab:'insights', l:'Add Ads Manager'}, 'ads', c.name); }

  const avgLate = od.length ? Math.round(od.reduce((a, t) => a - daysTo(t.due), 0) / od.length) : 0;
  area.Deadlines.push(od.length ? Math.max(0, 100 - od.length * 12 - avgLate) : 100);
  if (od.length) add('Deadlines', od.length > 4 ? 3 : 2, `${od.length} overdue task${od.length > 1 ? 's' : ''}, ${avgLate} days late on average`, noReason.length ? `${noReason.length} have no reason written. Either move the date or say what’s blocking.` : 'Every one has a reason logged. Now move the dates or clear them.', {preset:'overdue', l:'Open overdue'});

  if (stuck.length) add('Client care', 2, `${stuck.length} piece${stuck.length > 1 ? 's' : ''} waiting on client approval for 3+ days`, 'Send a friendly nudge on WhatsApp, or agree that silence after 48 hours means approved.', {preset:'sent', l:'See them'});

  const tScore = [];
  if (editing.length >= 4 && editors.length && mine / editing.length > .5){ tScore.push(40); add('Team', 2, `You hold ${mine} of ${editing.length} editing tasks`, 'Your time is worth more on strategy, clients and sales. Hand editing to your editor and review instead.', {go:'tasks', l:'Reassign'}); }
  else tScore.push(100);
  if (un >= 3){ tScore.push(50); add('Team', 1, `${un} open tasks have no owner`, 'Unassigned work is work nobody is doing.', {go:'tasks', l:'Assign'}); } else tScore.push(100);
  area.Team.push(...tScore);
  const scores = Object.fromEntries(Object.entries(area).map(([k, v]) => [k, v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length) : null]));
  const vals = Object.values(scores).filter(v => v !== null), total = vals.length ? Math.round(vals.reduce((a, b) => a + b, 0) / vals.length) : 0;
  const GROUP = {behind:n => `${n} pages are behind on content`, report:n => `Last month’s report not sent to ${n} clients`, noins:n => `No recent insights for ${n} clients`, nofol:n => `No recent follower counts for ${n} clients`, local:n => `Local presence under 50% for ${n} clients`, ads:n => `Ad results not tracked for ${n} clients`, plan:n => `${n} strategies not reviewed in 60+ days`, carousel:n => `Too few carousels for ${n} clients`, asks:n => `Client asks waiting over a week at ${n} clients`};
  const merged = [], seen = {};

async function applyImpact(c, x, i){

async function settleImpact(c, askId, idxs, state){

    if (await write(() => db.collection('prompts').add({client:c.id, title:x.title, prompt:x.prompt, negative:x.negative, settings:x.settings, use:x.use, what:x.what, tool:x.tool, ratio:x.ratio, createdAt:Date.now()}), 'Prompt saved')){ x.saved = true; render(); } }
  else if (a === 'delPrompt') await write(() => db.collection('prompts').doc(b.closest('[data-pid]').dataset.pid).delete(), 'Prompt deleted');
  else if (a === 'promptTask'){ const el = b.closest('[data-pid],[data-gi]'); const x = el.dataset.pid ? S.prompts.find(p => p.id === el.dataset.pid) : (ui.gen[c.id] || [])[Number(el.dataset.gi)]; if (!x) return;
    const kind = x.what === 'video' || x.what === 'edit' ? 'reel' : x.what === 'carousel' ? 'carousel' : c.id === 'eroe' ? 'ai' : 'post';
    await addTask({title:(x.what === 'edit' ? 'Edit: ' : 'Create: ') + (x.title || 'post') + (x.use ? ' — ' + x.use : ''), client:c.id, kind}) && toast('Task added'); }
  else if (a === 'addKw'){ const kws = [...(c.seo?.keywords || []), {kw:'', page:'', rank:''}]; await upd(c.id, {seo:{keywords:kws}}); }
  else if (a === 'delKw'){ const kws = (c.seo?.keywords || []).filter((_, n) => n !== Number(b.dataset.n)); await upd(c.id, {seo:{keywords:kws}}); }
  else if (a === 'compPost'){ ui.keep['i-type'] = 'Competitor post'; ui.keep['i-comp'] = b.dataset.name; go('client', c.id, 'insights'); }
  else if (a === 'delComp'){ await upd(c.id, {competitors:(c.competitors || []).filter((_, n) => n !== Number(b.dataset.n))}); }
  else if (a === 'delMember') await write(() => db.collection('team').doc(b.dataset.id).delete());
  else if (a === 'claim'){ if (await write(() => db.doc(`data/users/${myUid}/profile`).set({member:b.dataset.id}))){ myMember = b.dataset.id; render(); } }
});
document.addEventListener('change', async e => {
  const el = e.target, k = el.dataset && el.dataset.change; if (!k) return;
  const tid = el.closest('[data-tid]')?.dataset.tid;
  if (k === 'status') await write(() => tasksCol().doc(tid).update({status:el.value, doneMonth: el.value === 'done' ? monthKey : '', doneAt: el.value === 'done' ? Date.now() : 0, statusAt:{[el.value]:Date.now()}}));
  else if (k === 'assign') await write(() => tasksCol().doc(tid).update({assignee:el.value}));
  else if (k === 'whoami'){ myMember = el.value; if (myUid) await write(() => db.doc(`data/users/${myUid}/profile`).set({member:el.value})); render(); }
  else if (k === 'repMonth'){ ui.rMonth = el.value; render(); }
  else if (k === 'cbClient'){ ui.campDraft = {...readCampForm(), occ:'', client:el.value}; render(); }
  else if (k === 'cbOcc'){ const d = readCampForm(); if (el.value){ const e = EVENTS.find(x => x.d + '|' + x.name === el.value); if (e) Object.assign(d, occDefaults(e)); } else { d.occ = ''; d.occasion = ''; } ui.campDraft = d; render(); }
  else if (k === 'schedule'){ if (el.value) await write(() => tasksCol().doc(tid).update({due:el.value, month:el.value.slice(0, 7)}), 'Scheduled for ' + fmt(el.value)); }
  else if (k === 'iType'){ ui.keep['i-type'] = el.value; render(); }
  else if (k === 'srMonth'){ ui.srMonth = el.value; render(); }
  else if (k === 'repSec'){ const c = C(ui.cid), mk = ui.rMonth || monthKey, hide = new Set(repDoc(c, mk)?.hide || []); el.checked ? hide.delete(el.dataset.k) : hide.add(el.dataset.k); await saveRep(c, mk, {hide:[...hide]}); }
  else if (k === 'filt'){ ui.filt[el.dataset.k] = el.type === 'checkbox' ? el.checked : el.value; render(); }
  else if (k === 'local'){ const c = C(ui.cid); const items = (c.local?.items || []).map((it, n) => n === Number(el.dataset.n) ? {...it, done:el.checked} : it); await upd(c.id, {local:{items}}); }
});
document.addEventListener('submit', async e => {
  const f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault();
  const k = f.dataset.form, c = C(ui.cid), v = id => (document.getElementById(id)?.value ?? '').trim();
  if (k === 'newClient'){
    const name = v('nc-name'); if (!name) return;
    const id = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'client';
    const uid = S.allClients.some(x => x.id === id) ? id + '-' + Date.now().toString(36).slice(-4) : id;
    const usedSlots = S.allClients.map(slotOf), ci = [...CPAL.keys()].find(i => !usedSlots.includes(i)) ?? S.allClients.length % CPAL.length, hue = 0;
    const local = (S.allClients.find(x => x.local?.items)?.local.items || []).map(x => ({t:x.t, done:false}));
    const doc = {name, tag:v('nc-tag'), handle:v('nc-handle'), website:v('nc-web'), city:v('nc-city'), notes:v('nc-notes'), order:(Math.max(0, ...S.allClients.map(x => x.order || 0)) + 1), ci,
      target:{count:Math.max(0, Number(v('nc-target')) || 0)}, ads:{budget:v('nc-budget'), status:v('nc-budget') ? 'Planned' : 'Not set'}, brand:{language:v('nc-lang')}, plan:{}, next:'Draft the growth plan', status:'active', local:{items:local}, competitors:[], createdAt:Date.now()};
    if (await write(() => db.collection('clients').doc(uid).set(doc), 'Client added')){ ui.addClient = false; go('client', uid, 'overview'); }
    return;
  }
  if (k === 'ask'){ const text = v('ask-t'), pend = ui.askPend[c.id] || []; if (!text && !pend.length) return;
    ui.busy.ask = true; render();
    try {
      const imgs = [];
      for (const f of pend){ const r = await assets.upload(f.file); imgs.push(r.id); }
      const item = {id:Date.now().toString(36), kind:v('ask-k'), text:(text || 'See attached image' + (imgs.length > 1 ? 's' : '')).slice(0, 400), by:myMember || '', at:Date.now(), status:'open'};
      if (imgs.length) item.imgs = imgs;
      if (await saveAsks(c, [...(c.asks || []), item].slice(-60), 'Added')){ ui.keep['ask-' + c.id] = ''; if (sample) setTimeout(() => askImpact(C(c.id), item), 300); pend.forEach(f => URL.revokeObjectURL(f.url)); ui.askPend[c.id] = []; }
    } catch(e){ toast(e && e.code === 'quota_exceeded' ? 'Image storage is full. Delete old images first.' : 'Couldn’t upload the image. Try a PNG or JPG under 20 MB.'); }
    ui.busy.ask = false; render();
    return;
  }
  if (k === 'followers'){ const n = Number(v('fo-n')), d_ = v('fo-d') || today; if (!(n >= 0) || v('fo-n') === '') return;
    await upd(c.id, {followers:[...(c.followers || []).filter(x => x.d !== d_), {d:d_, n}].sort((a,b) => a.d.localeCompare(b.d)).slice(-200)}, 'Count added'); return; }
  if (k === 'folGoal'){ await upd(c.id, {followerGoal:Math.max(0, Number(v('fo-goal')) || 0)}, 'Goal saved'); return; }
  if (k === 'details'){ await upd(c.id, {name:v('d-name') || c.name, tag:v('d-tag'), handle:v('d-handle'), website:v('d-web'), city:v('d-city'), source:v('d-source'), fee:v('d-fee'), billingDay:Math.min(28, Math.max(0, Number(v('d-bill')) || 0))}, 'Details saved'); return; }
  if (k === 'campaign'){ const d = readCampForm(); if (!d.client) return; const id = 'cmp' + Date.now().toString(36);
    const doc = {client:d.client, name:d.name, occasion:d.occasion || '', offer:d.offer, goal:d.goal, target:Number(d.target) || 0, budget:d.budget, start:d.start, end:d.end, channels:d.channels, notes:d.notes, items:[], status:'', createdAt:Date.now()};
    if (await write(() => db.collection('campaigns').doc(id).set(doc))){ ui.campNew = false; ui.campDraft = null; ui.campId = id; go('campaign'); buildCampaign({id, ...doc}); } return; }
  if (k === 'campRes'){ const x = S.campaigns.find(q => q.id === ui.campId); if (!x) return; const r = {}; for (const [key] of RES){ const val = v('cr-' + key); if (val !== '') r[key] = val; } r.notes = v('cr-notes');
    await write(() => db.collection('campaigns').doc(x.id).update({results:r}), 'Results saved'); return; }
  if (k === 'dayTask'){ const title = v('dt-title'); if (!title || !ui.calDay) return; ['t-client','t-kind','t-who'].forEach((id, n) => ui.keep[id] = v(['dt-client','dt-kind','dt-who'][n]));
    if (await addTask({title, client:v('dt-client'), kind:v('dt-kind'), assignee:v('dt-who'), due:ui.calDay})){ ui.keep['dt-title'] = ''; toast('Task added'); render(); } return; }
  if (k === 'repStats'){ const mk = ui.rMonth || monthKey, stats = {}; for (const a of AN){ const x = v('an-' + a.k); if (x !== '' && Number.isFinite(num(x))) stats[a.k] = num(x); } await saveRep(c, mk, {stats}, 'Numbers saved'); return; }
  if (k === 'repNote'){ const mk = ui.rMonth || monthKey; if (await saveRep(c, mk, {note:v('rep-note')}, 'Note saved')) delete ui.keep['rep-note-' + c.id + '-' + mk]; return; }
  if (k === 'comment'){
    const tid = f.closest('[data-tid]').dataset.tid, t = S.tasks.find(x => x.id === tid); const text = v('cm-' + tid), nd = v('nd-' + tid);
    if (!t || !text) return;
    const upd_ = {comments:[...(t.comments || []), {who:myMember || '', text:text.slice(0, 500), at:Date.now()}].slice(-30)};
    if (nd) upd_.due = nd;
    if (await write(() => tasksCol().doc(tid).update(upd_), nd ? 'Comment posted, due date moved' : 'Comment posted')){ ui.keep['cm-' + tid] = ''; render(); }
    return;
  }
  if (k === 'next'){ const val = v('next-' + c.id); if (await upd(c.id, {next:val}, 'Saved')) delete ui.keep['next-' + c.id]; }
  else if (k === 'quickTask'){ const title = v('qt-' + c.id); if (!title) return; if (await addTask({title, client:c.id, kind:v('qk-' + c.id)})){ ui.keep['qt-' + c.id] = ''; toast('Task added'); render(); } }
  else if (k === 'task'){ const title = v('t-title'); if (!title) return; ['t-client','t-kind','t-who'].forEach(id => ui.keep[id] = v(id));
    if (await addTask({title, client:v('t-client'), kind:v('t-kind'), assignee:v('t-who'), due:v('t-due')})){ ui.keep['t-title'] = ''; toast('Task added'); render(); } }
  else if (k === 'plan'){ const ok = await savePlanVersion(c, {target:{count:Math.max(0, Number(v('p-count')) || 0)}, plan:{goal:v('p-goal'), audience:v('p-aud'), focus:v('p-focus'), pillars:v('p-pil').split(',').map(s => s.trim()).filter(Boolean)}}, 'Edited by hand'); if (ok){ ui.editing = null; render(); } }
  else if (k === 'insight') readInsight(c);
  else if (k === 'chat'){ const t = v('chat-' + c.id); if (t && sample && !ui.busy['chat:' + c.id]) chat(c, t); }
  else if (k === 'prompts'){ if (sample) makePrompts(c); }
  else if (k === 'write'){ ui.keep['w-mode'] = v('w-mode'); writeFor(c, v('w-mode'), v('w-brief')); }
  else if (k === 'ads') await upd(c.id, {ads:{budget:v('a-budget'), status:v('a-status')}}, 'Saved');
  else if (k === 'adNotes'){ if (await upd(c.id, {ads:{notes:v('a-notes')}}, 'Notes saved')) delete ui.keep['a-notes-' + c.id]; }
  else if (k === 'brand') await upd(c.id, {brand:{tone:v('b-tone'), language:v('b-lang'), look:v('b-look'), always:v('b-do'), never:v('b-dont'), tags:v('b-tags')}}, 'Brand kit saved');
  else if (k === 'seo'){ const kws = (c.seo?.keywords || []).map((x, n) => { const rank = v('kr-' + n); return {kw:v('kw-' + n), page:v('kp-' + n), rank, prev: rank !== (x.rank || '') && x.rank ? x.rank : (x.prev || '')}; }).filter(x => x.kw); await upd(c.id, {seo:{keywords:kws}}, 'Rankings saved'); }
  else if (k === 'comp'){ const n = v('cp-n'); if (!n) return; await upd(c.id, {competitors:[...(c.competitors || []), {name:n, note:v('cp-note')}]}, 'Added'); }
  else if (k === 'member'){ const n = v('m-name'); if (!n) return; await write(() => db.collection('team').add({name:n, role:v('m-role'), createdAt:Date.now()}), 'Member added'); }
});
$('#filePick').addEventListener('change', e => { e.target.accept = 'image/png,image/jpeg,image/webp,image/gif'; if (ui.pickTarget === 'restore'){ if (e.target.files[0]) readBackupFile(e.target.files[0]); ui.pickTarget = ''; e.target.value = ''; return; } if (ui.pickTarget === 'ask') addAskPending(e.target.files); else addPending(e.target.files); ui.pickTarget = ''; e.target.value = ''; });
function addAskPending(files){ const imgs = [...files].filter(f => /^image\//.test(f.type)); if (!imgs.length || !ui.cid) return; if (!assets){ toast('Images can’t be stored in this view.'); return; } const arr = ui.askPend[ui.cid] = ui.askPend[ui.cid] || []; for (const f of imgs.slice(0, 6 - arr.length)) arr.push({file:f, url:URL.createObjectURL(f)}); render(); }
document.addEventListener('paste', e => {
  if (!(ui.view === 'client' && (ui.ctab === 'insights' || ui.ctab === 'overview'))) return;
  const files = [...(e.clipboardData?.files || [])].filter(f => /^image\//.test(f.type));
  if (files.length){ e.preventDefault(); ui.ctab === 'insights' ? addPending(files) : addAskPending(files); }
});
document.addEventListener('dragstart', e => { const cd = e.target.closest && e.target.closest('.card[data-tid]'); if (cd){ e.dataTransfer.setData('text/plain', cd.dataset.tid); e.dataTransfer.effectAllowed = 'move'; cd.classList.add('dragging'); } });
document.addEventListener('dragend', e => { document.querySelectorAll('.dragging,.col.over').forEach(x => x.classList.remove('dragging', 'over')); });
document.addEventListener('dragover', e => { const col = e.target.closest && e.target.closest('.col[data-col]'); if (col){ e.preventDefault(); document.querySelectorAll('.col.over').forEach(x => x !== col && x.classList.remove('over')); col.classList.add('over'); } });
document.addEventListener('drop', async e => { const col = e.target.closest && e.target.closest('.col[data-col]'); if (!col) return; e.preventDefault(); col.classList.remove('over');
  const tid = e.dataTransfer.getData('text/plain'), t = S.tasks.find(x => x.id === tid); if (!t || t.status === col.dataset.col) return;
  await write(() => tasksCol().doc(tid).update({status:col.dataset.col, doneMonth: col.dataset.col === 'done' ? monthKey : '', doneAt: col.dataset.col === 'done' ? Date.now() : 0, statusAt:{[col.dataset.col]:Date.now()}}), 'Moved to ' + STATUS[col.dataset.col]); });
document.addEventListener('dragover', e => { const z = e.target.closest && e.target.closest('#askzone'); if (z && e.dataTransfer?.types?.includes('Files')){ e.preventDefault(); z.classList.add('dropon'); } });
document.addEventListener('dragleave', e => { const z = e.target.closest && e.target.closest('#askzone'); if (z && !z.contains(e.relatedTarget)) z.classList.remove('dropon'); });
document.addEventListener('drop', e => { const z = e.target.closest && e.target.closest('#askzone'); if (z && e.dataTransfer?.files?.length){ e.preventDefault(); z.classList.remove('dropon'); addAskPending(e.dataTransfer.files); } });
document.addEventListener('dragover', e => { const d = e.target.closest && e.target.closest('#drop'); if (d){ e.preventDefault(); d.classList.add('on'); } });
document.addEventListener('dragleave', e => { const d = e.target.closest && e.target.closest('#drop'); if (d) d.classList.remove('on'); });
document.addEventListener('drop', e => { const d = e.target.closest && e.target.closest('#drop'); if (d){ e.preventDefault(); addPending(e.dataTransfer.files); } });

/* ---------- boot ---------- */
function listen(name, sort){
  db.collection(name).onSnapshot(snap => {
    S[name] = snap.docs.map(d => ({id:d.id, ...d.data()}));
    if (sort) S[name].sort(sort);
    if (name === 'clients'){ S.allClients = S.clients; S.clients = S.allClients.filter(c => c.status !== 'archived'); }
    loaded[name] = true; schedule();
  }, () => { loaded[name] = true; schedule(); });
}
async function boot(){
  try { const gb = localStorage.getItem('rsd-gb'); if (['client','due','person'].includes(gb)) ui.groupBy = gb; } catch(e){}
  try { const n = JSON.parse(localStorage.getItem('rsd-nav') || 'null'); if (n && n.view){ ui.view = n.view; ui.cid = n.cid; ui.ctab = n.ctab || 'overview'; } } catch(e){}
  try { userNs = await claude.use('user'); } catch(e){}
  try { db = await claude.use('db'); } catch(e){}
  if (!db){ $('#main').innerHTML = '<h1>Reach Theory Desk</h1><p class="sub">Sign in to Claude to open your desk.</p>'; return; }
  if (userNs){
    try { role = (await userNs.canEdit()) ? 'admin' : 'editor'; } catch(e){}
    try { myUid = await userNs.id(); } catch(e){}
  }
  listen('tasks'); listen('team', (a,b) => (a.createdAt||0) - (b.createdAt||0));
  if (myUid){ try { const p = await db.doc(`data/users/${myUid}/profile`).get(); if (p.exists) myMember = p.data().member; } catch(e){} }
  if (role === 'editor'){ render(); return; }
  if (!myMember) myMember = 'me';
  listen('clients', (a,b) => (a.order ?? 99) - (b.order ?? 99));
  listen('insights');
  listen('prompts');
  listen('reports');
  db.doc('meta/backup').onSnapshot(sn => { S.backup = sn.exists ? sn.data() : null; schedule(); }, () => {});
  listen('campaigns', (a,b) => (b.createdAt||0) - (a.createdAt||0));
  render();
  try { sample = await claude.use('sample'); } catch(e){}
  if (sample){ try { const l = await sample.limits(); canImages = !!l.images; maxImages = l.images ? l.images.maxCount : 0; canTools = !!l.tools; } catch(e){} }
  try { assets = await claude.use('assets'); } catch(e){}
  try { downloads = await claude.use('downloads'); } catch(e){}
  render();
}
if (window.claude) boot(); else $('#main').innerHTML = '<h1>Reach Theory Desk</h1><p class="sub">Open this page from Claude to load your desk.</p>';
</script>
