<title>Reach Story Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: quiet sidebar (clients are the navigation) + one reading column; sections split by hairlines, no card grid.
   One accent (signal orange, "reach") used only for primary actions and the pace tick. */
:root{
  --bg:#f5f6f7; --surface:#ffffff; --sunk:#eceef1; --ink:#131518; --muted:#6a7078; --line:#e1e4e8;
  --accent:#d9481f; --accent-ink:#ffffff; --good:#17794a; --warn:#a15f00; --bad:#c2302a; --cl:46%;
  --f:"Geist",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
  --m:"Geist Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1113; --surface:#161a1d; --sunk:#1c2024; --ink:#eceef0; --muted:#9299a1; --line:#262b30;
  --accent:#ff7a4d; --accent-ink:#1a0b05; --good:#53c98b; --warn:#e3a84a; --bad:#ff7d74; --cl:64%; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1113; --surface:#161a1d; --sunk:#1c2024; --ink:#eceef0; --muted:#9299a1; --line:#262b30;
  --accent:#ff7a4d; --accent-ink:#1a0b05; --good:#53c98b; --warn:#e3a84a; --bad:#ff7d74; --cl:64%; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.5;padding-inline:16px;padding-block:28px 96px}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
h1{font-size:26px;letter-spacing:-.02em;line-height:1.2}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:inherit}
.app{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:210px minmax(0,1fr);gap:56px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 28px);align-self:start;display:flex;flex-direction:column;gap:22px}
.mark{font-family:var(--m);font-size:13px;letter-spacing:-.01em}
.mark span{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav .grp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px 8px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;color:var(--muted)}
.nav button:hover{color:var(--ink);background:var(--sunk)}
.nav button[aria-current="true"]{color:var(--ink);background:var(--sunk);font-weight:500}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .ct{font-family:var(--m);font-size:11px}
main{min-width:0;max-width:760px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:hsl(var(--h,220) 60% var(--cl));flex:none}
.sub{color:var(--muted);margin-top:4px}
.meta{font-family:var(--m);font-size:12px;color:var(--muted);display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:8px}
.sec{margin-top:36px}
.lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.lab .acts{display:flex;gap:8px;text-transform:none;letter-spacing:0;font-size:13px}
.muted{color:var(--muted)}
.mono{font-family:var(--m);font-variant-numeric:tabular-nums}
.b{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.b:hover{border-color:var(--muted)}
.b.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.b.pri:hover{filter:brightness(1.07)}
.b[disabled]{opacity:.5;cursor:default}
.lnk{all:unset;cursor:pointer;color:var(--accent);font-size:13px;font-weight:500}
.lnk:focus-visible{outline:2px solid var(--accent)}
.x{all:unset;cursor:pointer;color:var(--muted);padding:2px 6px;border-radius:4px;font-size:15px;line-height:1}
.x:hover{color:var(--bad);background:var(--sunk)}
.x:focus-visible{outline:2px solid var(--accent)}
input[type=text],input[type=number],input[type=date],input:not([type]),select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
textarea{width:100%;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--muted);outline:none}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:0}
.items{display:flex;flex-direction:column}
.it{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;padding:11px 0;border-bottom:1px solid var(--line);align-items:center}
.it:last-child{border-bottom:0}
.it .t{min-width:0;overflow-wrap:anywhere}
.it .s{font-size:12px;color:var(--muted);display:flex;gap:4px 12px;flex-wrap:wrap;align-items:center;margin-top:2px}
.it .c{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.it.click{cursor:pointer}
.it.click:hover .t{color:var(--accent)}
.it select{padding:4px 6px;font-size:12px}
.late{color:var(--bad);font-weight:500}
.empty{color:var(--muted);padding:6px 0}
.pill{font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.good{color:var(--good)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}.pill.neutral{color:var(--muted)}
.bar{position:relative;height:4px;background:var(--sunk);border-radius:2px;margin-top:8px}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:2px;background:var(--ink)}
.bar u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--accent);text-decoration:none}
.prog{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:baseline}
.big{font-family:var(--m);font-size:30px;font-weight:500;line-height:1;letter-spacing:-.02em}
.tabs2{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-top:22px;overflow-x:auto;scrollbar-width:none}
.tabs2 button{all:unset;cursor:pointer;padding:9px 0;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs2 button:hover{color:var(--ink)}
.tabs2 button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:500}
.tabs2 button:focus-visible{outline:2px solid var(--accent)}
.tabs2 + .sec{margin-top:24px}
.tabs2 + .sec > .lab{border-top:0;padding-top:0}
.dots{display:inline-flex;gap:3px;align-items:center}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 16px}
.kv dt{color:var(--muted);font-size:13px}
.kv dd{margin:0;overflow-wrap:anywhere}
ul.ls{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
ul.ls li{padding-left:2px}
.form{display:grid;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.form label>input,.form label>select,.form label>textarea{color:var(--ink);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.out{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;line-height:1.6}
.out b{font-weight:600}
.drop{border:1px dashed var(--muted);border-radius:8px;padding:18px;text-align:center;color:var(--muted);background:var(--surface)}
.drop.on{border-color:var(--accent);color:var(--ink)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs figure{margin:0;position:relative;width:84px;height:84px;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:var(--sunk)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs .x{position:absolute;top:2px;right:2px;background:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--m);font-size:12px;padding:2px 8px;border-radius:4px;background:var(--sunk)}
.chip b{font-weight:500}
.ins{padding:16px 0;border-bottom:1px solid var(--line);display:grid;gap:10px}
.ins:last-child{border-bottom:0}
.ins h3{font-size:15px}
.chat{display:flex;flex-direction:column;gap:12px;margin-bottom:12px}
.msg{max-width:92%;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}
.msg.u{align-self:flex-end;background:var(--sunk);padding:8px 12px;border-radius:10px 10px 2px 10px}
.msg.a{align-self:flex-start}
.check{display:flex;gap:10px;align-items:flex-start;padding:7px 0}
.check input{margin-top:3px;accent-color:var(--accent)}
.check.done span{color:var(--muted);text-decoration:line-through}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;min-width:480px}
.tbl th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl input{width:100%}
.ev{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev .dd{font-family:var(--m);font-size:12px;color:var(--muted);line-height:1.3}
.ev .dd b{display:block;font-size:20px;color:var(--ink);font-weight:500}
.ev.past{opacity:.45}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 80px);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:9;max-width:calc(100vw - 32px);font-size:13px}
.tabs{display:none}
.vh{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);gap:0}
  .side{display:none}
  main{max-width:none}
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom,0px) + 6px);z-index:8}
  .tabs button{all:unset;cursor:pointer;text-align:center;padding:9px 2px;border-radius:6px;color:var(--muted);font-size:13px}
  .tabs button[aria-current="true"]{color:var(--ink);font-weight:600;background:var(--sunk)}
  .tabs button:focus-visible{outline:2px solid var(--accent)}
  .kv{grid-template-columns:minmax(0,1fr)}
  .kv dt{margin-top:6px}
  .it{grid-template-columns:minmax(0,1fr)}
  .it .c{justify-content:flex-start}
}
</style>

<div class="app">
  <aside class="side" id="side"></aside>
  <main id="main"><p class="empty">Loading your desk…</p></main>
</div>
<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<div class="toast" id="toast" hidden></div>
<label class="vh" for="filePick">Choose screenshots</label>
<input type="file" id="filePick" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/^#{1,4}\s*(.+)$/gm, '<b>$1</b>');

const KINDS = {reel:'Reel (client clips)', carousel:'Carousel', post:'Photo / graphic post', ai:'AI visual', story:'Story', ad:'Meta ad', gbp:'Google post', seo:'SEO', website:'Website', strategy:'Strategy', other:'Other'};
const SHORT = {reel:'Reel', carousel:'Carousel', post:'Post', ai:'AI visual', story:'Story', ad:'Ad', gbp:'Google post', seo:'SEO', website:'Website', strategy:'Strategy', other:'Other'};
const CONTENT = ['reel','carousel','post','ai'];
const STATUS = {todo:'To do', editing:'Editing', sent:'With client', approved:'Approved', done:'Done'};
const INSIGHT_TYPES = ['Post insights','Reel insights','Story insights','Account overview','Meta Ads Manager','Google Business Profile','Search Console / website','Competitor post','Other'];
const WRITE_MODES = {
  caption:'Caption + hashtags', carousel:'Carousel slides', adcopy:'Meta ad copy (3 versions)', whatsapp:'WhatsApp broadcast',
  assets:'Ask client for photos/clips', review:'Google review request', gbp:'Google Business post', hooks:'10 hooks for a reel'
};
const AGENCY_RULES = [
  'The agency is The Reach Story (@the.reach.story), a small marketing studio in Khanna, Punjab: the owner, a partner (Panda) and one editor.',
  'We NEVER shoot video. Reels are edited from clips the client sends. Photos come from the client. For Eroe Clothing we generate AI product images.',
  'Instagram in 2026: sends per reach (DM shares) is the strongest signal for reaching non-followers; carousels have the highest engagement of any format; original content gets more distribution than reposts; reels need a hook in the first 3 seconds and work best at 30–90 seconds.',
  'Local Khanna clients win through Google Business Profile, reviews and Click-to-WhatsApp ads, not only Instagram.',
  'Be specific and practical. No generic advice. Everything must be doable by a 3-person team with the materials the client can send.'
];
const EVENTS = [
  {d:'2026-10-11', name:'Navratri begins (to 20 Oct)', who:['rkjewellers','djyps','omsons','reachstory'], prep:'Festive looks and dandiya-night posts. DJ YPS: push Navratri and Dussehra night bookings now.'},
  {d:'2026-10-20', name:'Dussehra', who:['masterwheels','rkjewellers','omsons','djyps','reachstory'], prep:'Greeting post plus a “new beginnings” offer. Many families buy vehicles on Dussehra: Master Wheels accessory and alloy packages.'},
  {d:'2026-10-29', name:'Karwa Chauth', who:['rkjewellers','omsons'], prep:'RK: gift-for-wife sets, ads from 15 Oct. Om Sons: couple festive outfits.'},
  {d:'2026-10-31', name:'Halloween (US)', who:['eroe'], prep:'Eroe: blanks for Halloween and fall merch drops. Posts in early October.'},
  {d:'2026-11-06', name:'Dhanteras', who:['rkjewellers','masterwheels'], prep:'The biggest jewellery buying day. RK: Meta ads live 3 weeks before (16 Oct), double budget in the final week, personal WhatsApp to top customers. Master Wheels: new-car alloy and accessory packages.'},
  {d:'2026-11-08', name:'Diwali', who:['omsons','rkjewellers','djyps','masterwheels','eroe','reachstory'], prep:'Greeting creative for every client, designed a week early. DJ YPS: Diwali party bookings. Om Sons: festive orders need 2–3 weeks, so push by mid-October.'},
  {d:'2026-11-11', name:'Bhai Dooj', who:['rkjewellers'], prep:'Gifts for sisters: light gold and silver.'},
  {d:'2026-11-20', name:'Dev Uthani Ekadashi: wedding season opens', who:['omsons','rkjewellers','djyps'], prep:'Weddings cluster after 20–21 Nov. Grooms book tailoring 4–8 weeks ahead, so Om Sons groom content runs from October. RK: bridal sets. DJ YPS: wedding packages.'},
  {d:'2026-11-24', name:'Guru Nanak Gurpurab', who:['omsons','rkjewellers','djyps','masterwheels','reachstory'], prep:'A respectful Punjabi greeting for every Khanna client. No sales push.'},
  {d:'2026-11-27', name:'Black Friday (US)', who:['eroe'], prep:'Eroe: wholesale tier promo or sample-pack offer, teased from 16 Nov. Cyber Monday is 30 Nov.'},
  {d:'2026-12-25', name:'Christmas', who:['eroe','djyps'], prep:'Eroe: holiday merch order-deadline posts in early December. DJ YPS: Christmas parties.'},
  {d:'2026-12-31', name:'New Year’s Eve', who:['djyps','reachstory','eroe'], prep:'DJ YPS: NYE bookings from early December. The Reach Story: year-in-review of client results.'},
  {d:'2027-01-13', name:'Lohri (13–14 Jan)', who:['omsons','rkjewellers','djyps','masterwheels','reachstory'], prep:'Punjab’s big winter festival. RK: first-Lohri gifts. DJ YPS: Lohri nights. Om Sons: Lohri outfits. Posts from early January.'}
];

/* ---------- dates ---------- */
const now = new Date();
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = iso(now);
const monthKey = today.slice(0, 7);
const dim = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
const day = now.getDate();
const daysTo = d => Math.round((new Date(d + 'T00:00:00') - new Date(today + 'T00:00:00')) / 864e5);
const fmt = d => new Date(d + 'T00:00:00').toLocaleDateString(undefined, {day:'numeric', month:'short'});
const monthName = now.toLocaleDateString(undefined, {month:'long'});

/* ---------- state ---------- */
let db = null, sample = null, assets = null, userNs = null;
let canImages = false, maxImages = 0, canTools = false;
let role = 'admin', myUid = null, myMember = null;
const S = {clients:[], tasks:[], team:[], insights:[]};
const loaded = {clients:false, tasks:false, team:false, insights:false};
const ui = {view:'today', cid:null, ctab:'overview', keep:{}, busy:{}, out:{}, chats:{}, ideas:{}, dayPlan:null,
  pending:[], editing:null, filt:{client:'', who:'', done:false}};

const C = id => S.clients.find(c => c.id === id);
const M = id => S.team.find(m => m.id === id);
const hueStyle = c => c ? `--h:${c.hue ?? 220}` : '';
const dot = c => c ? `<span class="dot" style="${hueStyle(c)}"></span>` : '';
const keep = (k, d = '') => ui.keep[k] ?? d;

/* ---------- derived ---------- */
const target = c => (c.target && c.target.count) || 0;
const posted = c => S.tasks.filter(t => t.client === c.id && t.status === 'done' && CONTENT.includes(t.kind) && t.doneMonth === monthKey).length;
function pace(c){
  const n = target(c), d = posted(c);
  if (!n) return {cls:'neutral', label:'No target', gap:0};
  if (d >= n) return {cls:'good', label:'Target hit', gap:0};
  const gap = Math.floor(n * day / dim) - d;
  if (gap <= 0) return {cls:'good', label:'On pace', gap:0};
  return {cls: gap >= Math.max(3, n * .2) ? 'bad' : 'warn', label:`${gap} behind`, gap};
}
const openTasks = cid => S.tasks.filter(t => t.status !== 'done' && (!cid || t.client === cid));
const clientInsights = cid => S.insights.filter(i => i.client === cid).sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
const eventsFor = cid => EVENTS.filter(e => e.who.includes(cid) && daysTo(e.d) >= -1);

function clientContext(c, opts = {}){
  const ins = clientInsights(c.id).slice(0, opts.insights ?? 10).map(i => ({date:i.date || new Date(i.createdAt||0).toISOString().slice(0,10), type:i.type, title:i.title, metrics:i.metrics, learnings:i.learnings}));
  return {
    today, dayOfMonth:day, daysInMonth:dim,
    client:{name:c.name, business:c.tag, instagram:c.handle, website:c.website, city:c.city, language:c.brand?.language || c.lang,
      contentSource:c.source, adBudgetPerMonth:c.ads?.budget, services:c.services, monthlyTarget:target(c), postedThisMonth:posted(c),
      nextAction:c.next, brand:c.brand, growthPlan:c.plan, research:c.research && {summary:c.research.summary, opportunities:c.research.opportunities, fixFirst:c.research.fixes},
      competitors:c.competitors},
    recentInsights:ins,
    openTasks:openTasks(c.id).slice(0, 15).map(t => `${t.title} [${SHORT[t.kind]||t.kind}, ${STATUS[t.status]}${t.due ? ', due ' + t.due : ''}]`),
    upcomingMoments:eventsFor(c.id).slice(0, 4).map(e => `${e.d} ${e.name}: ${e.prep}`)
  };
}
const preamble = 'Rules for you:\n- ' + AGENCY_RULES.join('\n- ');

/* ---------- shell ---------- */
function toast(m){ const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 3200); }
async function write(fn, ok){
  try { await fn(); if (ok) toast(ok); return true; }
  catch(e){ toast(e && e.code === 'invalid_argument' ? 'You don’t have permission to change this.' : e && e.code === 'quota_exceeded' ? 'Storage is full. Delete old insights first.' : 'Could not save. Try again.'); return false; }
}
const errCopy = e => ({not_granted:'Claude access was declined for this page. Reload to be asked again.', sampling_disabled:'Claude isn’t available on this account.', rate_limited:'Too many requests. Wait a minute and try again.', invalid_json:'Claude’s answer couldn’t be read. Try again.', images_unavailable:'This view can’t send images to Claude. Type the numbers in the note instead.', image_rejected:'That image couldn’t be read. Try a PNG or JPG screenshot.', prompt_too_large:'Too much to read at once. Try fewer screenshots.'}[e && e.code] || 'Something went wrong. Try again.');

function go(view, cid, ctab){
  ui.view = view; if (cid !== undefined) ui.cid = cid; if (ctab) ui.ctab = ctab;
  ui.editing = null;
  try { localStorage.setItem('rsd-nav', JSON.stringify({view:ui.view, cid:ui.cid, ctab:ui.ctab})); } catch(e){}
  render(); window.scrollTo(0, 0);
}

let pendingRender = false, rq = false;
const typing = () => { const a = document.activeElement; return a && $('#main').contains(a) && a.matches('input:not([type=checkbox]):not([type=file]),textarea'); };
function schedule(){
  if (typing()){ pendingRender = true; return; }
  if (!rq){ rq = true; requestAnimationFrame(() => { rq = false; render(); }); }
}
document.addEventListener('focusout', () => setTimeout(() => { if (pendingRender && !typing()){ pendingRender = false; render(); } }, 60));

/* ---------- render ---------- */
function render(){
  if (role === 'editor'){ $('#side').innerHTML = sideEditor(); $('#tabs').innerHTML = ''; $('#main').innerHTML = viewEditor(); return; }
  $('#side').innerHTML = side();
  $('#tabs').innerHTML = [['today','Today'],['clients','Clients'],['calendar','Calendar'],['tasks','Tasks']].map(([v,l]) =>
    `<button data-go="${v}" aria-current="${ui.view === v || (v === 'clients' && ui.view === 'client')}">${l}</button>`).join('');
  const v = ui.view === 'client' && C(ui.cid) ? viewClient(C(ui.cid)) :

}

function side(){
  const due = openTasks().filter(t => t.due && t.due <= today).length;
  return `<div class="mark">the.reach.story<span>desk · ${esc(now.toLocaleDateString(undefined,{day:'numeric',month:'short'}))} · day ${day}/${dim}</span></div>
  <nav class="nav" aria-label="Sections">

function taskRow(t, opts = {}){
  const c = C(t.client), late = t.status !== 'done' && t.due && t.due < today;
  return `<div class="it" data-tid="${esc(t.id)}">
    <div><div class="t">${esc(t.title)}</div>
      <div class="s">${opts.noClient ? '' : `<span>${dot(c)} ${esc(c ? c.name : t.clientName || '')}</span>`}<span>${esc(SHORT[t.kind] || t.kind)}</span>
      ${t.due ? `<span class="${late ? 'late' : ''}">${late ? 'Overdue · ' : ''}${esc(fmt(t.due))}</span>` : ''}
      ${opts.showWho && t.assignee ? `<span>${esc(M(t.assignee)?.name || '')}</span>` : ''}</div></div>

      <select id="st-${esc(t.id)}" data-change="status">${Object.entries(STATUS).map(([k,v]) => `<option value="${k}"${k===t.status?' selected':''}>${v}</option>`).join('')}</select>

const whoOptions = sel => `<option value="">Unassigned</option>` + S.team.map(m => `<option value="${esc(m.id)}"${m.id===sel?' selected':''}>${esc(m.name)}</option>`).join('');
const kindOptions = sel => Object.entries(KINDS).map(([k,v]) => `<option value="${k}"${k===sel?' selected':''}>${v}</option>`).join('');

function suggestions(key, items){
  const rows = items.map((i, n) => ({...i, n})).filter(i => !i.added);
  if (!rows.length) return `<p class="empty">All added. Generate again for more.</p>`;
  return `<div class="items">${rows.map(i => { const c = C(i.client); return `<div class="it" data-sug="${esc(key)}" data-n="${i.n}">
    <div><div class="t">${esc(i.title)}</div>
    <div class="s">${key === 'day' ? `<span>${dot(c)} ${esc(c?.name || '')}</span>` : ''}<span>${esc(SHORT[i.kind] || i.kind)}</span>${i.why ? `<span>${esc(i.why)}</span>` : ''}</div>
    ${i.need ? `<div class="s">Ask client for: ${esc(i.need)}</div>` : ''}</div>
    <div class="c"><label class="vh" for="sw-${esc(key)}-${i.n}">Assign</label><select id="sw-${esc(key)}-${i.n}" data-role="sugWho">${whoOptions(S.team.find(m => m.name.toLowerCase() === String(i.assignee||'').toLowerCase())?.id || '')}</select>
    <button class="b" data-act="addSug">Add</button></div></div>`; }).join('')}</div>
    <div class="row" style="margin-top:10px"><button class="lnk" data-act="addAllSug" data-key="${esc(key)}">Add all as tasks</button></div>`;
}
const busyOr = (k, html) => ui.busy[k] ? `<p class="empty">Thinking… this can take up to a minute.</p>` : html;

/* ----- Today ----- */
function viewToday(){
  const behind = S.clients.filter(c => pace(c).gap > 0);
  const due = openTasks().filter(t => t.due && t.due <= today).sort((a,b) => a.due.localeCompare(b.due));
  const soon = EVENTS.filter(e => daysTo(e.d) >= 0 && daysTo(e.d) <= 45).slice(0, 4);
  const unassigned = openTasks().filter(t => !t.assignee).length;
  return `<h1>${esc(now.toLocaleDateString(undefined,{weekday:'long', day:'numeric', month:'long'}))}</h1>
  <p class="sub">${!loaded.clients ? 'Loading…' : behind.length ? `${behind.length} of ${S.clients.length} pages are behind this month’s target. ${dim - day + 1} days left.` : `Every page is on pace. ${dim - day + 1} days left this month.`}</p>

  ${(() => { const n = S.insights.filter(i => i.unread).length; return n ? `<div class="sec"><div class="lab">Screenshots to read</div><p style="margin:0">${n} screenshot${n===1?'':'s'} waiting. Say <b>“read new insights”</b> in your Claude Code chat and the numbers and learnings will appear on each client’s Insights tab.</p></div>` : ''; })()}
  <div class="sec"><div class="lab">Next move per page</div>
  <div class="items">${S.clients.map(c => { const p = pace(c); return `<div class="it click" data-go="client" data-cid="${esc(c.id)}" tabindex="0" role="link">
    <div><div class="t">${esc(c.next || 'Set a next move on the client page')}</div><div class="s"><span>${dot(c)} ${esc(c.name)}</span><span class="pill ${p.cls}">${esc(p.label)}</span></div></div>
    <div class="c mono muted">${posted(c)}/${target(c)}</div></div>`; }).join('') || `<p class="empty">${loaded.clients ? 'No clients yet.' : 'Loading…'}</p>`}</div></div>

  <div class="sec"><div class="lab">Due today and overdue${unassigned ? `<span class="acts muted">${unassigned} open unassigned</span>` : ''}</div>
  <div class="items">${due.length ? due.map(t => taskRow(t)).join('') : `<p class="empty">${loaded.tasks ? 'Nothing due. Plan the day below.' : 'Loading…'}</p>`}</div></div>

  <div class="sec"><div class="lab">Coming up</div>
  <div class="items">${soon.map(e => `<div class="it"><div><div class="t">${esc(e.name)} <span class="muted mono" style="font-size:12px">· ${esc(fmt(e.d))} · in ${daysTo(e.d)} days</span></div><div class="s"><span class="dots">${e.who.map(id => dot(C(id))).join('')}</span><span>${esc(e.prep)}</span></div></div></div>`).join('') || '<p class="empty">No moments in the next 45 days.</p>'}</div></div>

  <div class="sec"><div class="lab">Plan my day<span class="acts">${sample ? `<button class="b pri" data-act="planDay" ${ui.busy.day ? 'disabled' : ''}>Plan with Claude</button>` : ''}</span></div>
  ${busyOr('day', ui.out.day ? `<p class="empty">${esc(ui.out.day)}</p>` : ui.dayPlan ? suggestions('day', ui.dayPlan) :
    `<p class="empty">${sample ? 'Claude reads every page’s target, research, recent insights and the festive calendar, then proposes today’s work. Add the tasks you want and assign them.' : 'Open this page in Claude to plan with AI.'}</p>`)}</div>`;
}

/* ----- Clients list ----- */

async function chat(c, text){
  const key = 'chat:' + c.id;
  const turns = ui.chats[c.id] = ui.chats[c.id] || [];
  turns.push({role:'user', content:text});
  ui.keep['chat-' + c.id] = '';
  ui.busy[key] = true; render();
  const lead = {role:'user', content:`${preamble}\n\nYou are the senior strategist at The Reach Story, advising on ${c.name}. Answer in plain English (write captions/hooks in the client's language). Be concrete and brief: short paragraphs or bullet lists, no fluff.${canTools ? ' If the owner asks you to plan or schedule work, use the add_task tool for each task.' : ''}\n\nWhat you know:\n${JSON.stringify(clientContext(c))}`};
  const opts = {cache:false};
  if (canTools) opts.tools = [{name:'add_task', description:'Adds one task for this client to the team task list. Returns "added". Use only when the owner asks to plan, schedule or add work.',
    inputSchema:{type:'object', properties:{title:{type:'string'}, kind:{type:'string', enum:Object.keys(KINDS)}, due:{type:'string', description:'YYYY-MM-DD or empty'}}, required:['title']},
    execute: async (inp) => { const ok = await addTask({title:String(inp.title||''), client:c.id, kind:String(inp.kind||'other'), due:/^\d{4}-\d\d-\d\d$/.test(String(inp.due||'')) ? String(inp.due) : ''}); if (!ok) throw new Error('could not save'); return 'added'; }}];
  try {
    const hist = turns.slice(-12);
    const {text: ans} = await sample([lead, ...(hist[0].role === 'assistant' ? hist.slice(1) : hist)], opts);
    turns.push({role:'assistant', content:ans});
  } catch(e){ turns.push({role:'assistant', content: e && e.text ? e.text + '\n\n(interrupted)' : errCopy(e)}); }
  ui.busy[key] = false; render();
  const inp = document.getElementById('chat-' + c.id); if (inp) inp.focus();
}

}
async function readInsight(c){
  const type = $('#i-type').value, date = $('#i-date').value, note = $('#i-note').value.trim();
  const files = ui.pending.map(p => p.file);
  if (!files.length && !note){ toast('Add a screenshot or type the numbers first.'); return; }
  ui.keep['i-type'] = type;
  ui.busy.ins = true; render();
  try {
    if (files.length && !assets){ toast('Screenshots can’t be stored in this view. Type the numbers in the note instead.'); ui.busy.ins = false; render(); return; }
    const queue = files.length && !canImages;
    let ids = [];
    if (files.length && assets){
      for (const f of files){ const r = await assets.upload(f); ids.push(r.id); }
    }
    let r = {};
    if (sample && !queue){
      const useImg = canImages && files.length;
      r = await sample.json(`${preamble}\n\nYou are the analyst for ${c.name}. ${useImg ? `Read the attached screenshot(s): ${type}.` : `Here are notes/numbers the owner typed: ${type}.`} ${note ? 'Owner’s note: ' + note : ''}\n${type === 'Competitor post' ? 'This is a COMPETITOR or reference account. Learnings = what we should borrow for our client and how to do it better.' : 'Extract every number you can see. Judge performance against an account of this size and against earlier insights.'}\n\nEarlier insights: ${JSON.stringify(clientInsights(c.id).slice(0, 6).map(i => ({date:i.date, title:i.title, metrics:i.metrics})))}\nClient: ${JSON.stringify(clientContext(c, {insights:0}).client)}\n\nReply with only JSON: {"title": "short label, e.g. Carousel: bridal set · 3 Oct", "date": "YYYY-MM-DD if visible else empty", "metrics": {"Reach": 1234, "...": "..."}, "summary": "2 sentences", "learnings": ["3 specific, reusable learnings"], "next": ["2 concrete next actions"]}`,
        useImg ? {cache:false, images:files.slice(0, maxImages || 5)} : {cache:false});
    }
    const doc = {client:c.id, type, note, date: (r.date && /^\d{4}-\d\d-\d\d$/.test(r.date)) ? r.date : date, assets:ids,
      title:String(r.title || type), metrics: r.metrics && typeof r.metrics === 'object' ? r.metrics : {}, summary:String(r.summary || ''),
      learnings:Array.isArray(r.learnings) ? r.learnings.map(String).slice(0, 6) : [], next:Array.isArray(r.next) ? r.next.map(String).slice(0, 4) : [], unread:!!queue, createdAt:Date.now()};
    if (await write(() => db.collection('insights').add(doc), queue ? 'Saved. Waiting to be read' : 'Insight saved')){
      ui.pending.forEach(p => URL.revokeObjectURL(p.url)); ui.pending = []; ui.keep['i-note'] = ''; ui.keep['i-date'] = '';
    }
  } catch(e){ toast(errCopy(e)); }
  ui.busy.ins = false; render();
}
function addPending(files){
  const imgs = [...files].filter(f => /^image\//.test(f.type));
  if (!imgs.length) return;
  for (const f of imgs) ui.pending.push({file:f, url:URL.createObjectURL(f)});
  if (maxImages && ui.pending.length > maxImages) toast(`Claude reads up to ${maxImages} screenshots at a time.`);
  render();
}

/* ---------- events ---------- */
document.addEventListener('input', e => { const k = e.target.dataset && e.target.dataset.keep; if (k) ui.keep[k] = e.target.value; });
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.it.click')){ e.preventDefault(); e.target.click(); } });
document.addEventListener('click', async e => {
  const g = e.target.closest('[data-go]');
  if (g && !e.target.closest('select,input,button:not([data-go])')){ go(g.dataset.go, g.dataset.cid ?? ui.cid, g.dataset.go === 'client' && g.dataset.cid !== ui.cid ? 'overview' : undefined); return; }
  const t = e.target.closest('[data-ctab]'); if (t){ ui.ctab = t.dataset.ctab; ui.editing = null; try { localStorage.setItem('rsd-nav', JSON.stringify({view:ui.view, cid:ui.cid, ctab:ui.ctab})); } catch(_){} render(); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, c = C(ui.cid), tid = b.closest('[data-tid]')?.dataset.tid;
  if (a === 'delTask') await write(() => tasksCol().doc(tid).delete());
  else if (a === 'planDay') planDay();
  else if (a === 'ideas') ideas(c);
  else if (a === 'addSug' || a === 'addAllSug'){
    const key = a === 'addSug' ? b.closest('[data-sug]').dataset.sug : b.dataset.key;
    const items = key === 'day' ? ui.dayPlan : ui.ideas[key.split(':')[1]];
    const rows = a === 'addSug' ? [b.closest('[data-sug]')] : [...document.querySelectorAll(`[data-sug="${CSS.escape(key)}"]`)];
    b.disabled = true;
    for (const r of rows){ const i = items[Number(r.dataset.n)]; if (!i || i.added) continue;
      if (await addTask({...i, assignee:r.querySelector('[data-role="sugWho"]').value, due: key === 'day' ? today : ''})) i.added = true; else break; }
    toast(rows.length > 1 ? 'Tasks added' : 'Task added'); render();
  }
  else if (a === 'editPlan'){ ui.editing = 'plan'; render(); }
  else if (a === 'cancelEdit'){ ui.editing = null; render(); }
  else if (a === 'pick') $('#filePick').click();
  else if (a === 'unpend'){ const [p] = ui.pending.splice(Number(b.dataset.i), 1); if (p) URL.revokeObjectURL(p.url); render(); }
  else if (a === 'clearPend'){ ui.pending.forEach(p => URL.revokeObjectURL(p.url)); ui.pending = []; render(); }
  else if (a === 'delInsight'){
    if (b.dataset.confirm !== '1'){ b.dataset.confirm = '1'; b.textContent = 'Delete?'; b.style.fontSize = '12px'; setTimeout(() => { if (b.isConnected){ b.dataset.confirm = ''; b.textContent = '×'; b.style.fontSize = ''; } }, 3000); return; }
    const ins = S.insights.find(i => i.id === b.dataset.id);
    if (await write(() => db.collection('insights').doc(b.dataset.id).delete(), 'Insight deleted') && ins?.assets?.length && assets)
      for (const id of ins.assets){ try { await assets.delete(id); } catch(_){} }
  }
  else if (a === 'clearChat'){ ui.chats[c.id] = []; render(); }
  else if (a === 'weekly') weekly(c);
  else if (a === 'report') report(c);
  else if (a === 'copy'){ const el = document.getElementById(b.dataset.src); if (!el) return;
    try { await navigator.clipboard.writeText(el.innerText); toast('Copied'); } catch(_){ const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Selected. Press Ctrl/Cmd + C to copy.'); } }
  else if (a === 'adPlan') adPlan(c);
  else if (a === 'addKw'){ const kws = [...(c.seo?.keywords || []), {kw:'', page:'', rank:''}]; await upd(c.id, {seo:{keywords:kws}}); }
  else if (a === 'delKw'){ const kws = (c.seo?.keywords || []).filter((_, n) => n !== Number(b.dataset.n)); await upd(c.id, {seo:{keywords:kws}}); }
  else if (a === 'delComp'){ await upd(c.id, {competitors:(c.competitors || []).filter((_, n) => n !== Number(b.dataset.n))}); }
  else if (a === 'delMember') await write(() => db.collection('team').doc(b.dataset.id).delete());
  else if (a === 'claim'){ if (await write(() => db.doc(`data/users/${myUid}/profile`).set({member:b.dataset.id}))){ myMember = b.dataset.id; render(); } }
});
document.addEventListener('change', async e => {
  const el = e.target, k = el.dataset && el.dataset.change; if (!k) return;
  const tid = el.closest('[data-tid]')?.dataset.tid;
  if (k === 'status') await write(() => tasksCol().doc(tid).update({status:el.value, doneMonth: el.value === 'done' ? monthKey : ''}));
  else if (k === 'assign') await write(() => tasksCol().doc(tid).update({assignee:el.value}));
  else if (k === 'filt'){ ui.filt[el.dataset.k] = el.type === 'checkbox' ? el.checked : el.value; render(); }
  else if (k === 'local'){ const c = C(ui.cid); const items = (c.local?.items || []).map((it, n) => n === Number(el.dataset.n) ? {...it, done:el.checked} : it); await upd(c.id, {local:{items}}); }
});
document.addEventListener('submit', async e => {
  const f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault();
  const k = f.dataset.form, c = C(ui.cid), v = id => (document.getElementById(id)?.value ?? '').trim();
  if (k === 'next'){ const val = v('next-' + c.id); if (await upd(c.id, {next:val}, 'Saved')) delete ui.keep['next-' + c.id]; }
  else if (k === 'quickTask'){ const title = v('qt-' + c.id); if (!title) return; if (await addTask({title, client:c.id, kind:v('qk-' + c.id)})){ ui.keep['qt-' + c.id] = ''; toast('Task added'); render(); } }
  else if (k === 'task'){ const title = v('t-title'); if (!title) return; ['t-client','t-kind','t-who'].forEach(id => ui.keep[id] = v(id));
    if (await addTask({title, client:v('t-client'), kind:v('t-kind'), assignee:v('t-who'), due:v('t-due')})){ ui.keep['t-title'] = ''; toast('Task added'); render(); } }
  else if (k === 'plan'){ const ok = await upd(c.id, {target:{count:Math.max(0, Number(v('p-count')) || 0)}, plan:{goal:v('p-goal'), audience:v('p-aud'), focus:v('p-focus'), pillars:v('p-pil').split(',').map(s => s.trim()).filter(Boolean)}}, 'Plan saved'); if (ok){ ui.editing = null; render(); } }
  else if (k === 'insight') readInsight(c);
  else if (k === 'chat'){ const t = v('chat-' + c.id); if (t && sample && !ui.busy['chat:' + c.id]) chat(c, t); }
  else if (k === 'write'){ ui.keep['w-mode'] = v('w-mode'); writeFor(c, v('w-mode'), v('w-brief')); }
  else if (k === 'ads') await upd(c.id, {ads:{budget:v('a-budget'), status:v('a-status')}}, 'Saved');
  else if (k === 'adNotes'){ if (await upd(c.id, {ads:{notes:v('a-notes')}}, 'Notes saved')) delete ui.keep['a-notes-' + c.id]; }
  else if (k === 'brand') await upd(c.id, {brand:{tone:v('b-tone'), language:v('b-lang'), look:v('b-look'), always:v('b-do'), never:v('b-dont'), tags:v('b-tags')}}, 'Brand kit saved');
  else if (k === 'seo'){ const kws = (c.seo?.keywords || []).map((x, n) => { const rank = v('kr-' + n); return {kw:v('kw-' + n), page:v('kp-' + n), rank, prev: rank !== (x.rank || '') && x.rank ? x.rank : (x.prev || '')}; }).filter(x => x.kw); await upd(c.id, {seo:{keywords:kws}}, 'Rankings saved'); }
  else if (k === 'comp'){ const n = v('cp-n'); if (!n) return; await upd(c.id, {competitors:[...(c.competitors || []), {name:n, note:v('cp-note')}]}, 'Added'); }
  else if (k === 'member'){ const n = v('m-name'); if (!n) return; await write(() => db.collection('team').add({name:n, role:v('m-role'), createdAt:Date.now()}), 'Member added'); }
});
$('#filePick').addEventListener('change', e => { addPending(e.target.files); e.target.value = ''; });
document.addEventListener('paste', e => {
  if (!(ui.view === 'client' && ui.ctab === 'insights')) return;
  const files = [...(e.clipboardData?.files || [])].filter(f => /^image\//.test(f.type));
  if (files.length){ e.preventDefault(); addPending(files); }
});
document.addEventListener('dragover', e => { const d = e.target.closest && e.target.closest('#drop'); if (d){ e.preventDefault(); d.classList.add('on'); } });
document.addEventListener('dragleave', e => { const d = e.target.closest && e.target.closest('#drop'); if (d) d.classList.remove('on'); });
document.addEventListener('drop', e => { const d = e.target.closest && e.target.closest('#drop'); if (d){ e.preventDefault(); addPending(e.dataTransfer.files); } });

/* ---------- boot ---------- */
function listen(name, sort){
  db.collection(name).onSnapshot(snap => {
    S[name] = snap.docs.map(d => ({id:d.id, ...d.data()}));
    if (sort) S[name].sort(sort);
    loaded[name] = true; schedule();
  }, () => { loaded[name] = true; schedule(); });
}
async function boot(){
  try { const n = JSON.parse(localStorage.getItem('rsd-nav') || 'null'); if (n && n.view){ ui.view = n.view; ui.cid = n.cid; ui.ctab = n.ctab || 'overview'; } } catch(e){}
  try { userNs = await claude.use('user'); } catch(e){}
  try { db = await claude.use('db'); } catch(e){}
  if (!db){ $('#main').innerHTML = '<h1>Reach Story Desk</h1><p class="sub">Sign in to Claude to open your desk.</p>'; return; }
  if (userNs){
    try { role = (await userNs.canEdit()) ? 'admin' : 'editor'; } catch(e){}
    try { myUid = await userNs.id(); } catch(e){}
  }
  listen('tasks'); listen('team', (a,b) => (a.createdAt||0) - (b.createdAt||0));
  if (role === 'editor'){
    if (myUid){ try { const p = await db.doc(`data/users/${myUid}/profile`).get(); if (p.exists) myMember = p.data().member; } catch(e){} }
    render(); return;
  }
  listen('clients', (a,b) => (a.order ?? 99) - (b.order ?? 99));
  listen('insights');
  render();
  try { sample = await claude.use('sample'); } catch(e){}
  if (sample){ try { const l = await sample.limits(); canImages = !!l.images; maxImages = l.images ? l.images.maxCount : 0; canTools = !!l.tools; } catch(e){} }
  try { assets = await claude.use('assets'); } catch(e){}
  render();
}
if (window.claude) boot(); else $('#main').innerHTML = '<h1>Reach Story Desk</h1><p class="sub">Open this page from Claude to load your desk.</p>';
</script>
