<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Reach Theory Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: fixed dark sidebar + full-width work area. Flat surfaces, 1px rules, small radii, one blue accent. */
:root{
  --bg:#f4f5f7; --surface:#ffffff; --sunk:#f0f2f5; --ink:#1b1f24; --muted:#5b6572; --line:#d8dce2;
  --accent:#1f4fd8; --accent-ink:#ffffff; --good:#1a7f4b; --warn:#975f00; --bad:#b42318; --cl:46%;
  --r:6px; --shadow:none;
  --f:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --m:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13161b; --surface:#1a1e25; --sunk:#222730; --ink:#e5e8ed; --muted:#97a0ad; --line:#2d343f;
  --accent:#6b93ff; --accent-ink:#0b1020; --good:#4cc38a; --warn:#e0a93b; --bad:#ff8a80; --cl:64%; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13161b; --surface:#1a1e25; --sunk:#222730; --ink:#e5e8ed; --muted:#97a0ad; --line:#2d343f;
  --accent:#6b93ff; --accent-ink:#0b1020; --good:#4cc38a; --warn:#e0a93b; --bad:#ff8a80; --cl:64%; color-scheme:dark}

/* Appearance: data-look (resolved light/dark) is set by the page's own picker. */
html:root[data-look="light"]{--bg:#f4f5f7; --surface:#ffffff; --sunk:#f0f2f5; --ink:#1b1f24; --muted:#5b6572; --line:#d8dce2; --accent:#1f4fd8; --accent-ink:#ffffff; --good:#1a7f4b; --warn:#975f00; --bad:#b42318; --cl:46%; --shadow:none; color-scheme:light}
html:root[data-look="dark"]{--bg:#13161b; --surface:#1a1e25; --sunk:#222730; --ink:#e5e8ed; --muted:#97a0ad; --line:#2d343f; --accent:#6b93ff; --accent-ink:#0b1020; --good:#4cc38a; --warn:#e0a93b; --bad:#ff8a80; --cl:64%; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
[style*="--c1"]{--cc:var(--c1)}
html[data-look="dark"] [style*="--c2"]{--cc:var(--c2)}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:13.5px;line-height:1.5;padding:0;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
h1{font-size:22px;letter-spacing:-.01em;line-height:1.25}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:inherit}
.app{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:210px minmax(0,1fr);gap:56px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 28px);align-self:start;display:flex;flex-direction:column;gap:22px}
.mark{font-family:var(--m);font-size:13px;letter-spacing:-.01em}
.mark span{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav .grp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px 8px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;color:var(--muted)}
.nav button:hover{color:var(--ink);background:var(--sunk)}
.nav button[aria-current="true"]{color:var(--ink);background:var(--sunk);font-weight:500}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .ct{font-family:var(--m);font-size:11px}
main{min-width:0;max-width:760px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--cc,var(--muted));flex:none}
.sub{color:var(--muted);margin-top:4px}
.meta{font-family:var(--m);font-size:12px;color:var(--muted);display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:8px}
.sec{margin-top:20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.sec.flat{background:none;border:0;box-shadow:none;padding:0}
.lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.lab .acts{display:flex;gap:8px;text-transform:none;letter-spacing:0;font-size:13px}
.muted{color:var(--muted)}
.mono{font-family:var(--m);font-variant-numeric:tabular-nums}
.b{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.b:hover{border-color:var(--muted)}
.b.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.b.pri:hover{filter:brightness(1.07)}
.b[disabled]{opacity:.5;cursor:default}
.lnk{all:unset;cursor:pointer;color:var(--accent);font-size:13px;font-weight:500}
.lnk:focus-visible{outline:2px solid var(--accent)}
.x{all:unset;cursor:pointer;color:var(--muted);padding:2px 6px;border-radius:4px;font-size:15px;line-height:1}
.x:hover{color:var(--bad);background:var(--sunk)}
.x:focus-visible{outline:2px solid var(--accent)}
input[type=text],input[type=number],input[type=date],input:not([type]),select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
textarea{width:100%;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--muted);outline:none}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:0}
.items{display:flex;flex-direction:column}
.it{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;padding:11px 0;border-bottom:1px solid var(--line);align-items:center}
.it:last-child{border-bottom:0}
.it .t{min-width:0;overflow-wrap:anywhere}
.it .s{font-size:12px;color:var(--muted);display:flex;gap:4px 12px;flex-wrap:wrap;align-items:center;margin-top:2px}
.it .c{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.it.click{cursor:pointer}
.it.click:hover .t{color:var(--accent)}
.it select{padding:4px 6px;font-size:12px}
.late{color:var(--bad);font-weight:500}
.empty{color:var(--muted);padding:6px 0}
.pill{font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.good{color:var(--good)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--warn)}.pill.neutral{color:var(--muted)}
.bar{position:relative;height:4px;background:var(--sunk);border-radius:2px;margin-top:8px}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:2px;background:var(--ink)}
.bar u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--accent);text-decoration:none}
.prog{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:baseline}
.big{font-family:var(--m);font-size:30px;font-weight:500;line-height:1;letter-spacing:-.02em}
.tabs2{display:flex;gap:4px;padding:4px;background:var(--sunk);border-radius:10px;margin-top:20px;overflow-x:auto;scrollbar-width:none}
.tabs2 button{all:unset;cursor:pointer;padding:7px 14px;border-radius:7px;color:var(--muted);white-space:nowrap;transition:background .15s,color .15s}
.tabs2 button:hover{color:var(--ink)}
.tabs2 button[aria-current="true"]{color:var(--ink);background:var(--surface);font-weight:500;box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.tabs2 button:focus-visible{outline:2px solid var(--accent)}
.tabs2 + .sec{margin-top:20px}
.dots{display:inline-flex;gap:3px;align-items:center}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 16px}
.kv dt{color:var(--muted);font-size:13px}
.kv dd{margin:0;overflow-wrap:anywhere}
ul.ls{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
ul.ls li{padding-left:2px}
.form{display:grid;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.form label>input,.form label>select,.form label>textarea{color:var(--ink);font-size:14px}
.form label.check{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:13px}
.form label.check input{margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.out{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;line-height:1.6}
.out b{font-weight:600}
.drop{border:1px dashed var(--muted);border-radius:8px;padding:18px;text-align:center;color:var(--muted);background:var(--surface)}
.drop.on{border-color:var(--accent);color:var(--ink)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs figure{margin:0;position:relative;width:84px;height:84px;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:var(--sunk)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs .x{position:absolute;top:2px;right:2px;background:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--m);font-size:12px;padding:2px 8px;border-radius:4px;background:var(--sunk)}
.chip b{font-weight:500}
button.chip{border:1px solid var(--line);cursor:pointer;font-family:inherit;font-size:12.5px;padding:4px 10px;border-radius:99px;color:var(--ink)}
button.chip:hover{border-color:var(--accent);color:var(--accent)}
.ins{padding:16px 0;border-bottom:1px solid var(--line);display:grid;gap:10px}
.ins:last-child{border-bottom:0}
.ins h3{font-size:15px}
.chat{display:flex;flex-direction:column;gap:12px;margin-bottom:12px}
.msg{max-width:92%;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}
.msg.u{align-self:flex-end;background:var(--sunk);padding:8px 12px;border-radius:10px 10px 2px 10px}
.msg.a{align-self:flex-start}
.check{display:flex;gap:10px;align-items:flex-start;padding:7px 0}
.check input{margin-top:3px;accent-color:var(--accent)}
.check.done span{color:var(--muted);text-decoration:line-through}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;min-width:480px}
.tbl th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl input{width:100%}
.ev{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev .dd{font-family:var(--m);font-size:12px;color:var(--muted);line-height:1.3}
.ev .dd b{display:block;font-size:20px;color:var(--ink);font-weight:500}
.ev.past{opacity:.45}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 80px);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:9;max-width:calc(100vw - 32px);font-size:13px}
.toast .tact{all:unset;cursor:pointer;font-weight:600;text-decoration:underline;margin-left:10px;color:inherit}
.toast .tact:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.stats > div{padding:14px 18px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0}
.stats > div:first-child{border-left:0}
.stats b{font-family:var(--m);font-size:24px;font-weight:500;line-height:1.1;letter-spacing:-.02em}
.stats b small{font-size:14px;color:var(--muted);font-weight:400}
.stats span{font-size:12px;color:var(--muted)}
.stats .hot b{color:var(--warn)}
.alert{margin-top:16px;display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;padding:11px 16px;border-radius:10px;border:1px solid color-mix(in srgb,var(--bad) 35%,transparent);background:color-mix(in srgb,var(--bad) 9%,var(--surface));color:var(--bad);font-weight:500}
.alert.warn{border-color:color-mix(in srgb,var(--warn) 35%,transparent);background:color-mix(in srgb,var(--warn) 10%,var(--surface));color:var(--warn)}
.hero{margin:-4px 0 0;padding:22px 22px 18px;border-radius:var(--r);border:1px solid color-mix(in srgb,var(--cc) 30%,var(--line));background:linear-gradient(135deg,color-mix(in srgb,var(--cc) 14%,var(--surface)),var(--surface) 70%)}
.mini{height:3px;background:var(--sunk);border-radius:2px;margin-top:8px;max-width:240px;position:relative}
.mini i{position:absolute;inset:0 auto 0 0;border-radius:2px;background:var(--cc)}
.k{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--sunk);color:var(--muted)}
select[data-s]{font-weight:500}
select[data-s="editing"]{border-color:color-mix(in srgb,var(--accent) 50%,var(--line));color:var(--accent)}
select[data-s="sent"]{border-color:color-mix(in srgb,var(--warn) 50%,var(--line));color:var(--warn)}
select[data-s="review"]{border-color:color-mix(in srgb,var(--accent) 30%,var(--line));color:var(--ink);font-weight:600}
select[data-s="approved"],select[data-s="done"]{border-color:color-mix(in srgb,var(--good) 50%,var(--line));color:var(--good)}
.look{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.look .grp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{all:unset;cursor:pointer;width:22px;height:22px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgb(0 0 0 / .12);position:relative}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.sw button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.seg{display:inline-flex;background:var(--sunk);border-radius:8px;padding:3px;gap:2px}
.seg button{all:unset;cursor:pointer;padding:4px 10px;border-radius:6px;font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.seg button:focus-visible{outline:2px solid var(--accent)}
.b,.it,.nav button,.lnk{transition:background .15s,color .15s,border-color .15s}
.it.click:hover{background:color-mix(in srgb,var(--sunk) 60%,transparent);margin-inline:-20px;padding-inline:20px}

.badge{background:var(--bad);color:var(--surface);border-radius:99px;padding:0 6px;font-size:11px;line-height:17px}
.prefs{border-top:1px solid var(--line);padding-top:12px;font-size:13px}
.prefs summary{cursor:pointer;color:var(--ink);list-style:none;padding:4px 8px;border-radius:6px}
.prefs summary::-webkit-details-marker{display:none}
.prefs summary:hover{background:var(--sunk)}
.prefs[open] summary{margin-bottom:10px}
.prefs .look{border-top:0;padding:0 8px}
.whoami{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);padding:0 8px 12px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.eyebrow{margin:0 0 6px;font-size:12px;color:var(--muted);letter-spacing:.01em}
.pdot{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.pdot.good{background:var(--good)}.pdot.warn{background:var(--warn)}.pdot.bad{background:var(--warn)}
.count{display:inline-flex;align-items:center;gap:8px;font-size:13px}
.clamp{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.evrow{display:flex;gap:14px;align-items:flex-start}
.when{display:flex;flex-direction:column;align-items:center;min-width:40px;font-size:11px;color:var(--muted);text-transform:uppercase;line-height:1.2}
.when b{font-size:18px;color:var(--ink);font-weight:500}
.cbtn{all:unset;cursor:pointer;font-size:12px;color:var(--muted);border-bottom:1px dotted currentColor}
.cbtn:hover{color:var(--ink)}
.cbtn.need{color:var(--bad);font-weight:500}
.cbtn:focus-visible{outline:2px solid var(--accent)}
.lastc{font-size:12.5px;color:var(--muted);margin-top:5px;padding-left:10px;border-left:2px solid var(--line);overflow-wrap:anywhere}
.lastc b{font-weight:500;color:var(--ink)}
.thread{grid-column:1 / -1;display:flex;flex-direction:column;gap:10px;background:var(--sunk);border-radius:10px;padding:12px 14px;margin-top:6px}
.thread .cm{font-size:13px;overflow-wrap:anywhere}
.thread .cm b{font-weight:500}
.thread input[type=date]{flex:0 0 auto}
.it.is-late{box-shadow:inset 3px 0 0 var(--bad);padding-left:12px}

/* ---- v7: navigation, board, grid, followers, report ---- */
main.wide{max-width:none}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.search{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--muted);font-size:13px}
.search:hover{border-color:var(--muted);color:var(--ink)}
.search:focus-visible{outline:2px solid var(--accent)}
.search span{flex:1}
kbd{font-family:var(--m);font-size:10.5px;padding:1px 5px;border:1px solid var(--line);border-radius:4px;color:var(--muted);background:var(--sunk)}
.nav button{padding:7px 10px}
.nav button[aria-current="true"]{background:var(--surface);box-shadow:0 1px 2px rgb(0 0 0 / .06),inset 0 0 0 1px var(--line)}
.nav .grp{display:flex;justify-content:space-between;align-items:center;margin-right:4px}
.addc{all:unset;cursor:pointer;color:var(--muted);border-radius:5px;padding:2px;display:flex}
.addc:hover{color:var(--accent);background:var(--sunk)}
.addc:focus-visible{outline:2px solid var(--accent)}
.crumb{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:10px}
.crumb .lnk{font-weight:400}
.stat{all:unset;box-sizing:border-box;cursor:pointer;padding:14px 18px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0;transition:background .15s}
.stats > .stat:first-child{border-left:0}
.stat:hover{background:var(--sunk)}
.stat:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.stat .arr{opacity:0;transition:opacity .15s;color:var(--accent)}
.stat:hover .arr,.stat:focus-visible .arr{opacity:1}
button.alert{all:unset;box-sizing:border-box;cursor:pointer;margin-top:16px;display:flex;width:100%;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;padding:11px 16px;border-radius:10px;border:1px solid color-mix(in srgb,var(--bad) 35%,transparent);background:color-mix(in srgb,var(--bad) 9%,var(--surface));color:var(--bad);font-weight:500}
button.alert:hover{background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
button.alert:focus-visible{outline:2px solid var(--accent)}
.kpi{all:unset;cursor:pointer;text-align:right;display:flex;flex-direction:column;gap:2px;align-items:flex-end;padding:4px 6px;border-radius:8px}
.kpi:hover{background:color-mix(in srgb,var(--surface) 60%,transparent)}
.kpi:focus-visible{outline:2px solid var(--accent)}
.kpi b{font-family:var(--m);font-size:26px;font-weight:500;line-height:1;letter-spacing:-.02em}
.kpi b small{font-size:15px;color:var(--muted)}
.kpi > span{font-size:12px;color:var(--muted)}
.b{display:inline-flex;align-items:center;gap:6px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.addline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.addline input[type=text]{flex:1 1 260px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.filters select{padding:5px 8px;font-size:13px}
.fchip{display:inline-flex;align-items:center;gap:4px;padding:3px 4px 3px 10px;border-radius:99px;background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--accent);font-size:13px;font-weight:500}
.fchip button{all:unset;cursor:pointer;padding:0 6px;border-radius:99px}
.fchip button:hover{background:color-mix(in srgb,var(--accent) 20%,transparent)}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;margin-top:20px;padding-bottom:6px}
.col{background:var(--sunk);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:180px;border:1px dashed transparent;transition:border-color .15s,background .15s}
.col.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--sunk))}
.colh{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:500;padding:2px 4px 4px}
.colh .mono{margin-left:auto}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.s-editing{background:var(--accent)}.s-review{background:color-mix(in srgb,var(--accent) 45%,var(--ink))}.s-sent{background:var(--warn)}.s-approved,.s-done{background:var(--good)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;cursor:grab;box-shadow:0 1px 2px rgb(0 0 0 / .04)}
.card:active{cursor:grabbing}
.card.dragging{opacity:.4}
.card .t{font-size:13.5px;overflow-wrap:anywhere}
.card .s{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cardf{display:flex;justify-content:space-between;align-items:center;font-size:12px}
.bsel{font-size:12px;padding:3px 6px}
.card .thread{margin-top:2px;padding:10px}
.drophint{margin:0;color:var(--muted);font-size:12px;text-align:center;padding:18px 0;border:1px dashed var(--line);border-radius:8px}
.av{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--sunk);border:1px solid var(--line);font-size:10px;font-weight:600;color:var(--ink);vertical-align:middle}
.load{height:4px;border-radius:2px;background:var(--sunk);margin:8px 0 4px;max-width:260px;position:relative;overflow:hidden}
.load i{position:absolute;inset:0 auto 0 0;border-radius:2px}
.gridwrap{overflow-x:auto}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(96px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:680px}
.gh{background:var(--sunk);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 8px}
.cell{background:var(--surface);min-height:104px;padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cell.off{background:var(--bg)}
.cell.pastd{background:color-mix(in srgb,var(--surface) 70%,var(--bg))}
.cell.now{box-shadow:inset 0 0 0 2px var(--accent)}
.dn{font-family:var(--m);font-size:12px;color:var(--muted)}
.cell.now .dn{color:var(--accent);font-weight:600}
.gchip{all:unset;box-sizing:border-box;cursor:pointer;font-size:11px;line-height:1.3;padding:2px 6px;border-radius:5px;background:color-mix(in srgb,var(--cc,var(--muted)) 16%,var(--surface));border-left:3px solid var(--cc,var(--muted));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.gchip.ev{cursor:default;background:var(--sunk);border-left-color:var(--muted);color:var(--muted)}
.gchip.done{text-decoration:line-through;opacity:.6}
.gchip:focus-visible{outline:2px solid var(--accent)}
.chartwrap{position:relative}
.chart{width:100%;height:auto;display:block;touch-action:none}
.ftip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:7px;line-height:1.35;white-space:nowrap}
.ftip span{opacity:.7}
.tl{display:flex;flex-direction:column;gap:14px;border-left:2px solid var(--line);margin-left:5px;padding-left:18px}
.tli{position:relative;font-size:14px}
.tld{position:absolute;left:-25px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--muted)}
.tli.now .tld{border-color:var(--accent);background:var(--accent)}
.proposal{background:color-mix(in srgb,var(--accent) 6%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 25%,var(--line));border-radius:10px;padding:14px 16px;margin-bottom:14px}
.todo .it{grid-template-columns:auto minmax(0,1fr) auto}
.todo .tick{width:18px;height:18px;border:1.5px solid var(--line2,var(--muted));border-radius:5px;background:none;padding:0;cursor:pointer}
.todo .tick:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.tlink{all:unset;cursor:pointer;font-weight:500;line-height:1.35}
.tlink:hover,.tlink:focus-visible{color:var(--accent)}
.tlink .chev{font-size:10px;color:var(--muted);margin-left:6px}
.bdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:middle}
.brief h4{margin:14px 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.brief h4:first-of-type{margin-top:4px}
.brief p{margin:0;line-height:1.6;font-size:14px}
.brief ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:14px;line-height:1.55}
.bstep{all:unset;cursor:pointer;display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line);width:100%;box-sizing:border-box;font-size:14px;line-height:1.5}
.bstep:first-of-type{border-top:0}
.bstep .bx{flex:none;width:17px;height:17px;border:1.5px solid var(--muted);border-radius:5px;margin-top:2px;display:grid;place-items:center;font-size:11px;color:#fff}
.bstep.on .bx{background:var(--good);border-color:var(--good)}
.bstep.on .bt{text-decoration:line-through;color:var(--muted)}
.bstep .bm{margin-left:auto;flex:none;font-size:12px;color:var(--muted);white-space:nowrap}
.bpost{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.oldblock{border:1px solid color-mix(in srgb,var(--warn) 35%,var(--line));background:color-mix(in srgb,var(--warn) 6%,var(--surface));border-radius:10px;padding:12px 14px;margin-bottom:14px}
.focus{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c1,var(--accent));border-radius:12px;padding:16px 18px;margin-bottom:12px}
.focus h2{margin:6px 0 12px;font-size:20px;line-height:1.3;font-weight:500}
.mbtn{all:unset;cursor:pointer;padding:0 8px;font-size:18px;line-height:1;color:var(--muted);border-radius:6px}
.mbtn:hover,.mbtn[aria-expanded="true"]{background:var(--sunk);color:var(--ink)}
.rmk{display:flex;flex-direction:column;gap:8px}
.rmk label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.cbtn.has{color:var(--accent)}
.etform{grid-column:1/-1;margin-top:8px;padding:12px 14px;border-radius:10px;background:var(--sunk);display:flex;flex-direction:column;gap:10px}
.etform .g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.etform label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.todo .sched{color:var(--accent)}
.todo input[type=date]{padding:3px 6px;font-size:12px}
.k.ask{background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--accent)}
.k.wait{background:color-mix(in srgb,var(--warn) 14%,var(--surface));color:var(--warn)}
.needrow{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;gap:6px 12px;width:100%;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.needrow:last-child{border-bottom:0}
.needrow .t{display:flex;gap:10px;align-items:center;min-width:0}
.needrow:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sec.needs{border-color:color-mix(in srgb,var(--accent) 28%,var(--line))}
.it.dim .t{color:var(--muted)}
.hf{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:10px;background:var(--sunk)}
.hfl{font-size:12px;font-weight:600;letter-spacing:.02em}
.hf select{font-size:13px;padding:5px 8px}
.gens{display:flex;flex-direction:column;gap:6px}
.gen{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sk{display:block;height:12px;border-radius:6px;margin:8px 0;background:linear-gradient(90deg,var(--sunk),color-mix(in srgb,var(--sunk) 40%,var(--surface)),var(--sunk));background-size:200% 100%;animation:sk 1.2s ease-in-out infinite}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
.cmdk{position:fixed;inset:0;z-index:20;background:rgb(10 12 16 / .38);display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px}
.cmdk[hidden]{display:none}
.cmdbox{width:min(560px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 60px -12px rgb(0 0 0 / .35);overflow:hidden}
.cmdin{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.cmdin input{flex:1;border:0;background:none;font-size:16px;padding:4px 0;outline:none}
.cmdin input:focus-visible{outline:none}
.cmdl{max-height:52vh;overflow-y:auto;padding:6px}
.cmdi{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:8px;font-size:14px}
.cmdi .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmdi .muted{font-size:12px}
.cmdi[aria-selected="true"],.cmdi:hover{background:var(--sunk)}
/* report: always light, fixed palette so the PDF looks the same for every viewer */
.repwrap{overflow:hidden;margin-top:18px;padding:18px;background:var(--sunk);border-radius:var(--r)}
.rep{width:794px;margin:0 auto;background:#ffffff;color:#16181c;padding:48px 56px;font-family:var(--f);box-shadow:0 8px 30px -10px rgb(0 0 0 / .25)}
.rep-top{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:18px;border-bottom:2px solid var(--rc)}
.rep-brand{font-family:var(--m);font-size:15px;color:#16181c}
.rep-sm{font-size:11.5px;color:#6b6f76;line-height:1.5}
.rep-m{font-size:16px;font-weight:600;color:#16181c}
.rep-client{margin:26px 0 8px}
.rep-cn{font-size:30px;font-weight:600;letter-spacing:-.02em;color:#16181c;line-height:1.15}
.rep-h{font-size:19px;font-weight:600;margin:22px 0 6px;color:#16181c}
.rep-p{margin:0 0 6px;color:#3a3e45;font-size:14px;line-height:1.6}
.rep-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0 6px}
.rep-tiles div{background:var(--rt);border-radius:10px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:4px}
.rep-tiles b{font-family:var(--m);font-size:24px;font-weight:500;color:#16181c;letter-spacing:-.02em}
.rep-tiles b small{font-size:13px;color:#6b6f76}
.rep-tiles span{font-size:11.5px;color:#565a61}
.rep-s{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--rd);margin:24px 0 8px;font-weight:600}
.rep-ul{margin:0;padding-left:18px;color:#26292e;font-size:14px;line-height:1.65}
.rep-kinds{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;color:#3a3e45}
.rep-kinds b{font-family:var(--m);font-weight:500;color:#16181c}
.rep-t{width:100%;border-collapse:collapse;font-size:14px;color:#26292e}
.rep-t td{padding:8px 6px;border-bottom:1px solid #eceef1;vertical-align:top}
.rep-n{width:24px;font-family:var(--m);color:#6b6f76}
.rep-v{text-align:right;font-family:var(--m);white-space:nowrap}
.rep-chart{border:1px solid #eceef1;border-radius:10px;padding:10px}
.rep-foot{display:flex;justify-content:space-between;margin-top:34px;padding-top:12px;border-top:1px solid #eceef1;font-size:11.5px;color:#6b6f76;font-family:var(--m)}

/* ---- v8: report editor ---- */
.mark.home{all:unset;cursor:pointer;display:block;font-family:var(--m);font-size:13px;border-radius:6px;padding:2px 4px;margin:-2px -4px}
.mark.home:hover{color:var(--accent)}
.mark.home:focus-visible{outline:2px solid var(--accent)}
.repgrid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start;margin-top:6px}
.repside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);max-height:calc(100vh - 32px);overflow-y:auto;display:flex;flex-direction:column;padding-bottom:8px}
.repside .sec{padding:14px 16px}
.repgrid .repwrap{margin-top:0}
.col2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.col2 .b{justify-content:center;white-space:normal;text-align:center}
.col2 .b.pri{grid-column:1/-1}
.chk{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13px}
.chk .cb{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;flex:none;color:var(--accent-ink)}
.chk.ok .cb{background:var(--good);border-color:var(--good)}
.chk.ok .grow{color:var(--muted)}
.anform{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.anform label{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--muted);min-width:0}
.anform input{font-family:var(--m);font-size:13px;padding:6px 8px;width:100%}
.secs{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.secs .check{padding:4px 0;font-size:13px}
.rep-note{margin:16px 0 4px;padding:14px 16px;border-left:3px solid var(--rc);background:#fafafa;font-size:14px;line-height:1.6;color:#26292e;font-style:italic}
.rep-an{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rep-an > div{border:1px solid #eceef1;border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;background:#ffffff}
.rep-al{font-size:11.5px;color:#565a61}
.rep-an b{font-family:var(--m);font-size:22px;font-weight:500;color:#16181c;letter-spacing:-.02em;line-height:1.15}
.rep-an b small{font-size:13px;color:#6b6f76}
.rep-ch{font-size:11.5px;color:#6b6f76;font-family:var(--m)}
.rep-ch.up{color:#17794a}
.rep-ch.down{color:#c2302a}
.rep-der{margin:10px 0 0;font-size:13px;color:#3a3e45;background:var(--rt);border-radius:8px;padding:9px 12px}
@media (max-width:1100px){.repgrid{grid-template-columns:minmax(0,1fr)}.repside{position:static;max-height:none}}

/* ---- v9: studio review ---- */
.srhead{display:grid;grid-template-columns:180px minmax(0,1fr);gap:24px;align-items:center}
.srscore{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.srscore b{font-family:var(--m);font-size:52px;font-weight:500;line-height:1;letter-spacing:-.03em}
.srscore b.good{color:var(--good)}.srscore b.warn{color:var(--warn)}.srscore b.bad{color:var(--bad)}
.srscore > span:not(.pill){font-size:12px;color:var(--muted)}
.srareas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 22px;font-size:13px}
.clickrow{cursor:pointer}
.clickrow:hover td{background:var(--sunk)}
@media (max-width:820px){.srhead{grid-template-columns:minmax(0,1fr)}.srareas{grid-template-columns:minmax(0,1fr)}}

/* ---- v10: client cards ---- */
.ccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:16px;margin-top:20px}
.ccard{cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 18px 14px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s,border-color .15s;min-width:0}
.ccard::before{content:"";position:absolute;inset:0 0 auto 0;height:96px;background:linear-gradient(180deg,color-mix(in srgb,var(--cc) 20%,var(--surface)),var(--surface))}
.ccard::after{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--cc)}
.ccard:hover{border-color:var(--cc);transform:translateY(-1px)}
.ccard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ccard > *{position:relative}
.cc-top{position:relative;display:flex;align-items:flex-end;gap:12px;padding-top:28px}
.mono-av{flex:none;width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-weight:600;font-size:16px;letter-spacing:.02em;background:var(--cc);color:var(--cink,#fff);box-shadow:0 0 0 3px var(--surface)}
.cc-name{min-width:0;flex:1;display:flex;flex-direction:column;padding-bottom:2px}
.cc-name b{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-name span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-top .pill{margin-bottom:4px}
.cc-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.cc-kpis > div{background:var(--sunk);border-radius:8px;padding:8px 9px;display:flex;flex-direction:column;gap:2px;min-width:0}
.cc-kpis b{font-family:var(--m);font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-kpis b small{font-size:11px;color:var(--muted)}
.cc-kpis span{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-next{margin:0;font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cc-foot{display:flex;justify-content:space-between;gap:10px;font-family:var(--m);font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}

.prow2{position:relative;padding-left:16px !important}
.prow2::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--cc)}
.prow2 + .prow2{border-top:0}
.prog2{display:grid !important;grid-template-columns:auto;justify-items:end;gap:5px;min-width:120px}
.minibar{position:relative;display:block;width:120px;height:5px;border-radius:3px;background:color-mix(in srgb,var(--cc) 14%,var(--sunk))}
.minibar i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--cc)}
.minibar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.45;text-decoration:none}
.cc-kpis > div{background:color-mix(in srgb,var(--cc) 7%,var(--sunk))}

/* ---- v12: calendar day panel ---- */
button.cell{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);min-height:108px;padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0;transition:background .12s}
button.cell:hover{background:color-mix(in srgb,var(--accent) 5%,var(--surface))}
button.cell:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
button.cell.pastd{background:color-mix(in srgb,var(--surface) 70%,var(--bg))}
button.cell.now{box-shadow:inset 0 0 0 2px var(--accent)}
button.cell.sel{background:color-mix(in srgb,var(--accent) 10%,var(--surface));box-shadow:inset 0 0 0 2px var(--ink)}
.dnrow{display:flex;justify-content:space-between;align-items:center}
.dcount{font-family:var(--m);font-size:10.5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--sunk);display:grid;place-items:center;color:var(--ink)}
.dcount.late{background:color-mix(in srgb,var(--bad) 16%,var(--surface));color:var(--bad)}
span.gchip{cursor:inherit;display:block}
.more{font-size:11px;color:var(--muted);padding-left:2px}
.daypanel{border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.evnote{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:8px;background:var(--sunk);margin-bottom:10px;font-size:13px}
.evnote span{color:var(--muted)}

.genprog{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:13px;color:var(--muted)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}

const DUP_STOP = new Set('a an the and or to for of in on at by as with from into per each one this that your our their its is it add set up new make then also all any more'.split(' '));

function splitTitle(txt){
  const t = String(txt || '').trim();
  if (t.length <= 72) return [t, ''];
  let best = -1, len = 0;
  for (const sep of [' — ', ' – ', ': ', '; ', '. ', ' - ', ', ']){ const k = t.indexOf(sep, 24); if (k > 0 && k <= 90 && (best < 0 || k < best)){ best = k; len = sep.length; } }
  if (best > 0) return [t.slice(0, best).replace(/[,:;.]$/, ''), t.slice(best + len).trim()];
  const cut = t.lastIndexOf(' ', 64); const k = cut > 30 ? cut : 64;
  return [t.slice(0, k) + '…', '…' + t.slice(k).trim()];
}

}

const rtMade = new Set();
function routinePeriod(r){
  if (r.every === 'week'){ const mon = new Date(now.getFullYear(), now.getMonth(), now.getDate() - (now.getDay() + 6) % 7);
    const due = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + Math.min(6, Math.max(0, (Number(r.day) || 1) - 1))); return {key:iso(mon), due:iso(due)}; }
  return {key:monthKey, due:`${monthKey}-${pad(Math.min(dim, Math.max(1, Number(r.day) || 1)))}`};
}
// Owner/partner only, once a day per device (or right after a routine is added): create this period's task for each page if it isn't there yet.
async function runRoutines(force){
  if (role !== 'admin' || !loaded.tasks || !loaded.clients || !S.routinesLoaded || !(S.routines || []).length) return;
  if (!force){ let last = ''; try { last = localStorage.getItem('rsd-rt') || ''; } catch(e){} if (last === today) return; try { localStorage.setItem('rsd-rt', today); } catch(e){} }
  for (const r of S.routines){ const {key, due} = routinePeriod(r);
    const targets = r.client === 'all' ? S.clients.filter(c => c.status !== 'paused') : [C(r.client)].filter(c => c && c.status !== 'archived' && c.status !== 'paused');
    for (const c of targets){ const rk = `${r.id}:${key}:${c.id}`;
      if (rtMade.has(rk) || S.tasks.some(t => t.routine === rk)) continue; rtMade.add(rk);
      if (!(await addTask({title:r.title, client:c.id, kind:r.kind || 'other', assignee:M(r.who) ? r.who : '', due:due < today ? today : due, routine:rk}))) return; } }
}

async function doBackup(){

async function readBackupFile(f){

  let j; try { j = JSON.parse(await f.text()); } catch(e){ ui.restore = {error:bad}; go('today'); return; }
  if (!j || j.app !== 'Reach Theory Desk' || !j.data){ ui.restore = {error:bad}; go('today'); return; }
  const have = {clients:S.allClients, tasks:S.tasks, team:S.team, insights:S.insights, prompts:S.prompts, reports:S.reports, campaigns:S.campaigns, invoices:S.invoices};
  const missing = {}; let total = 0;
  for (const c of BK_COLS){ const ids = new Set((have[c] || []).map(x => x.id)); missing[c] = (j.data[c] || []).filter(x => x && x.id && !ids.has(x.id)); total += missing[c].length; }
  const haveEv = new Set((S.customEvents || []).map(e => e.id));
  const moments = ((j.data.meta || []).find(m => m && m.id === 'calendar')?.events || []).filter(e => e && e.id && !haveEv.has(e.id));

  ui.busy.restore = false; render();
}

/* ----- Higgsfield: generate a task's image from its prompt, matched to the client's brand identity and reference images ----- */
const HF = 'Higgsfield';
const hfOk = what => !!mcp && ['image','carousel','cover'].includes(what);
const HF_RATIO = {'4:5':'4:5', '9:16':'9:16', '1:1':'1:1', '16:9':'16:9'};
const HF_ERR = {needs_reauth:'Higgsfield needs reconnecting. Reconnect it in claude.ai Settings → Connectors.', server_not_connected:'Higgsfield isn’t connected for you. Add it in claude.ai Settings → Connectors.', selection_required:'You have more than one Higgsfield connector. Choose one when Claude asks.', not_in_manifest:'Higgsfield was turned off for this desk. Allow it from the page’s connector settings.', blocked_by_policy:'Your organisation blocks Higgsfield here.', server_unavailable:'Higgsfield didn’t answer. The image may still be generating: check your Higgsfield library before trying again.', upstream_error:'Higgsfield didn’t answer. The image may still be generating: check your Higgsfield library before trying again.'};
const hfErr = e => (e && e.code === 'tool_error' ? 'Higgsfield said: ' + String(e.message || 'the request failed').slice(0, 180) : HF_ERR[e && e.code]) || 'Couldn’t reach Higgsfield. Check your Higgsfield library before trying again.';
function hfParams(t, i){
  const c = C(t.client), x = t.gen?.items?.[i]; if (!c || !x) return null;
  const ident = (c.brand?.identity || '').trim(), refs = (c.hfRefs || []).slice(0, 4);
  const imgRules = (c.rules || []).filter(r => r && r.t && (r.scope || 'all') !== 'words').map(r => '- ' + r.t).join('\n');
  const prompt = [imgRules ? 'BRAND RULES, must follow:\n' + imgRules : '', x.prompt, x.negative ? 'Avoid: ' + x.negative : '', ident ? 'BRAND IDENTITY, follow exactly: ' + ident : '', refs.length ? 'Match the look of the reference images.' : ''].filter(Boolean).join('\n\n').slice(0, 3800);
  return {model:'gpt_image_2_5', aspect_ratio:HF_RATIO[t.gen.ratio] || '4:5', quality:'medium', prompt, ...(refs.length ? {medias:refs.map(r => ({value:r.id, role:'image_references'}))} : {})};
}
function hfButton(t, i){
  const k = `hf:${t.id}:${i}`, cost = ui.hfCost?.[k];
  if (ui.busy[k]) return `<span class="genprog" style="margin:0"><span class="spin" aria-hidden="true"></span><span>${esc(ui.hfStage?.[k] || 'Working…')} <span class="mono" data-el="${esc(k)}"></span></span></span>`;
  return cost !== undefined ? `<button class="b pri" data-act="hfGo" data-i="${i}">Generate for ${esc(String(cost))} credit${cost === 1 ? '' : 's'}</button><button class="lnk" data-act="hfCancel" data-i="${i}">Cancel</button>`
    : `<button class="b" data-act="hfCost" data-i="${i}">Generate in Higgsfield</button>`;
}
function hfResults(t, i){
  const k = `hf:${t.id}:${i}`, imgs = (t.hfImages || []).filter(h => h.i === i);
  return `${ui.out[k] ? `<p class="late" style="font-size:13px;margin:4px 0 0">${esc(ui.out[k])}</p>` : ''}${imgs.length ? `<div class="items">${imgs.slice(-4).map(h => `<div class="it"><div><div class="t"><a class="lnk" href="${esc(h.url)}" target="_blank" rel="noopener">Open image ↗</a></div><div class="s"><span>${esc(ago(h.at))}</span>${t.post?.link === h.url ? '<span>Post’s creative</span>' : ''}</div></div>
    <div class="c">${t.post?.link === h.url ? '' : `<button class="lnk" data-act="hfUse" data-job="${esc(h.job)}">Use for the post</button>`}<button class="lnk" data-act="hfRef" data-job="${esc(h.job)}">Use as brand reference</button></div></div>`).join('')}</div>` : ''}`;
}
async function hfCost(t, i){
  const k = `hf:${t.id}:${i}`, p = hfParams(t, i); if (!p) return;
  ui.busy[k] = true; ui.hfStage = {...(ui.hfStage || {}), [k]:'Checking the cost…'}; delete ui.out[k]; render();
  try { const r = await mcp.callTool(HF, 'generate_image', {params:{...p, get_cost:true}, context:'Cost check before generating a client post image from the agency desk'}, {cache:false});
    const credits = r.payload?.cost?.credits ?? r.payload?.cost?.credits_exact;
    if (credits === undefined) throw {code:'tool_error', message:'no price came back'};
    ui.hfCost = {...(ui.hfCost || {}), [k]:credits};
  } catch(e){ ui.out[k] = hfErr(e); }
  ui.busy[k] = false; render();
}
// One generation per press (never retried automatically: a failed answer doesn't prove nothing was made), then wait for the result with read-only polls.
async function hfGo(t, i){
  const k = `hf:${t.id}:${i}`, p = hfParams(t, i); if (!p) return;
  delete ui.hfCost[k]; ui.busy[k] = true; ui.t0[k] = Date.now(); ui.hfStage = {...(ui.hfStage || {}), [k]:'Generating, about half a minute…'}; delete ui.out[k]; render();
  try {
    const r = await mcp.callTool(HF, 'generate_image', {params:{...p, use_unlim:false}, context:'Generate a brand-matched client post image from the agency desk'}, {cache:false});
    const job = r.payload?.results?.[0]?.id || r.payload?.job_id || r.payload?.id;
    if (!job) throw {code:'tool_error', message:typeof r.payload?.unlim_choice === 'string' ? r.payload.unlim_choice : 'no job id came back'};

/* ----- Tasks ----- */
function presetMatch(t){
  const p = ui.filt.preset;
  if (p === 'overdue') return isLate(t);
  if (p === 'sent') return t.status === 'sent';
  if (p === 'review') return t.status === 'review';
  if (p === 'waiting') return t.status !== 'done' && !!t.waiting;
  if (p === 'open') return t.status !== 'done';
  if (p === 'today') return t.status !== 'done' && t.due === today;
  if (p === 'week') return t.status !== 'done' && t.due && t.due >= today && daysTo(t.due) <= 7;
  if (p === 'unassigned') return t.status !== 'done' && !asg(t);
  return true;
}
const PRESETS = {overdue:'Overdue', review:'Ready for review', waiting:'Waiting on client', sent:'With client', open:'Open', today:'Due today', week:'This week', unassigned:'Unassigned'};
function viewTasks(){
  const f = ui.filt, board = ui.taskView === 'board';

  <div class="sec toolbar">

        <label class="row" style="gap:4px;color:var(--muted);font-size:13px"><input type="checkbox" id="f-done" data-change="filt" data-k="done" ${f.done?'checked':''}> Done</label>`}

function taskGroups(list){
  const g = ui.groupBy, groups = [];

const folSorted = c => (c.followers || []).filter(x => x && x.d && Number.isFinite(Number(x.n))).map(x => ({d:x.d, n:Number(x.n)})).sort((a,b) => a.d.localeCompare(b.d));
function folStats(f){
  if (!f.length) return null;
  const last = f.at(-1), first = f[0];
  const cut = iso(new Date(new Date(last.d + 'T00:00:00') - 30 * 864e5));
  const base30 = [...f].reverse().find(x => x.d <= cut) || first;
  const spanW = Math.max(1, (new Date(last.d) - new Date(first.d)) / (7 * 864e5));
  const perWeek = f.length > 1 ? (last.n - first.n) / spanW : 0;
  return {last, first, ch30:last.n - base30.n, pct30: base30.n ? (last.n - base30.n) / base30.n * 100 : 0, perWeek};
}
function chartSvg(f, opts = {}){
  const W = opts.w || 720, H = opts.h || 220, L = 52, R = 16, T = 14, B = 28;
  if (!f.length) return '';
  const xs = f.map(p => new Date(p.d + 'T00:00:00').getTime());
  const x0 = Math.min(...xs), x1 = Math.max(...xs) === x0 ? x0 + 864e5 : Math.max(...xs);
  let y0 = Math.min(...f.map(p => p.n)), y1 = Math.max(...f.map(p => p.n));
  const padY = Math.max(10, (y1 - y0) * .15); y0 = Math.max(0, Math.floor((y0 - padY) / 10) * 10); y1 = Math.ceil((y1 + padY) / 10) * 10;
  const X = t => L + (t - x0) / (x1 - x0) * (W - L - R), Y = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  const pts = f.map((p, i) => [X(xs[i]), Y(p.n)]);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = line + ` L${pts.at(-1)[0].toFixed(1)} ${H - B} L${pts[0][0].toFixed(1)} ${H - B} Z`;
  const ticks = [0, 1, 2, 3].map(i => y0 + (y1 - y0) * i / 3);
  const ink = opts.ink || 'var(--muted)', grid = opts.grid || 'var(--line)', col = opts.color || 'var(--cc)', surf = opts.surface || 'var(--surface)';
  const xl = [f[0], f[Math.floor((f.length - 1) / 2)], f.at(-1)].filter((p, i, a) => a.indexOf(p) === i);
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Followers from ${esc(fmt(f[0].d))} to ${esc(fmt(f.at(-1).d))}: ${fmtN(f[0].n)} to ${fmtN(f.at(-1).n)}" data-pts='${esc(JSON.stringify(f.map((p, i) => [pts[i][0], pts[i][1], p.d, p.n])))}'>
    ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="${grid}" stroke-width="1"/><text x="${L - 8}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="${ink}" font-family="Geist Mono, monospace">${fmtN(Math.round(v))}</text>`).join('')}
    ${xl.map(p => { const x = X(new Date(p.d + 'T00:00:00').getTime()); return `<text x="${x.toFixed(1)}" y="${H - 8}" text-anchor="${x < L + 30 ? 'start' : x > W - R - 30 ? 'end' : 'middle'}" font-size="11" fill="${ink}">${esc(fmt(p.d))}</text>`; }).join('')}
    <path d="${area}" fill="${col}" fill-opacity=".10" stroke="none"/>
    <path d="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="4.5" fill="${col}" stroke="${surf}" stroke-width="2"/>
    ${opts.static ? '' : `<line class="xh" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="${ink}" stroke-width="1" stroke-dasharray="3 3" opacity="0"/><circle class="hp" r="5" fill="${col}" stroke="${surf}" stroke-width="2" opacity="0"/><rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent" class="hit"/>`}
  </svg>`;
}
function wireChart(){
  const svg = document.querySelector('.chart'); if (!svg || !svg.dataset.pts) return;
  const pts = JSON.parse(svg.dataset.pts), tip = document.getElementById('ftip'), xh = svg.querySelector('.xh'), hp = svg.querySelector('.hp');
  const move = ev => {
    const r = svg.getBoundingClientRect(), vx = (ev.clientX - r.left) / r.width * svg.viewBox.baseVal.width;
    const p = pts.reduce((a, b) => Math.abs(b[0] - vx) < Math.abs(a[0] - vx) ? b : a);
    xh.setAttribute('x1', p[0]); xh.setAttribute('x2', p[0]); xh.setAttribute('opacity', '.6');
    hp.setAttribute('cx', p[0]); hp.setAttribute('cy', p[1]); hp.setAttribute('opacity', '1');
    tip.hidden = false; tip.innerHTML = `<b>${fmtN(p[3])}</b> followers<br><span>${esc(fmt(p[2]))}</span>`;
    const px = p[0] / svg.viewBox.baseVal.width * r.width, py = p[1] / svg.viewBox.baseVal.height * r.height;
    tip.style.left = Math.min(r.width - 120, Math.max(0, px + 10)) + 'px'; tip.style.top = Math.max(0, py - 44) + 'px';
  };
  const hit = svg.querySelector('.hit');
  hit.addEventListener('pointermove', move); hit.addEventListener('pointerdown', move);
  hit.addEventListener('pointerleave', () => { tip.hidden = true; xh.setAttribute('opacity', '0'); hp.setAttribute('opacity', '0'); });
}

/* ----- Monthly report ----- */
const num = v => { if (typeof v === 'number') return v; const m = String(v ?? '').replace(/[,₹$\s]/g, '').match(/^(-?[\d.]+)([kKmM])?/); if (!m) return NaN; return Number(m[1]) * (m[2] ? (/k/i.test(m[2]) ? 1e3 : 1e6) : 1); };
const AN = [
  {k:'reached', l:'Accounts reached', re:/^(accounts )?reach(ed)?$/i},
  {k:'nonFollowerPct', l:'Reach from non-followers', re:/non.?followers?/i, pct:true},
  {k:'newFollowers', l:'New followers', re:/^(new followers|follows|followers gained|net followers|net follows)$/i},
  {k:'views', l:'Views', re:/^(views|plays|impressions)$/i, add:true},
  {k:'engaged', l:'Accounts engaged', re:/^accounts engaged$/i},
  {k:'interactions', l:'Interactions', re:/^(interactions|content interactions|engagement)$/i, add:true},
  {k:'profileVisits', l:'Profile visits', re:/^profile (visits|activity)$/i, add:true},
  {k:'linkTaps', l:'Link and website taps', re:/(external )?link taps|website taps|link clicks/i, add:true},
  {k:'leads', l:'Leads and messages', re:/^(leads|results|messaging conversations( started)?|conversations|calls)$/i, add:true},
  {k:'adSpend', l:'Ad spend', re:/^(amount spent|spend|ad spend)$/i, money:true, add:true}
];
const insMonth = i => (i.date || iso(new Date(i.createdAt || 0))).slice(0, 7);
const prevMonth = mk => { const [y, m] = mk.split('-').map(Number); return iso(new Date(y, m - 2, 1)).slice(0, 7); };
const repDoc = (c, mk) => S.reports.find(r => r.id === `${c.id}_${mk}`) || null;
function monthStats(c, mk){
  const ins = S.insights.filter(i => i.client === c.id && !i.unread && i.type !== 'Competitor post' && insMonth(i) === mk);
  const overview = ins.filter(i => i.type === 'Account overview').sort((a,b) => (b.createdAt||0) - (a.createdAt||0))[0];
  const auto = {}, src = {};
  if (overview) for (const a of AN) for (const [k, v] of Object.entries(overview.metrics || {})) if (a.re.test(k.trim()) && Number.isFinite(num(v))){ auto[a.k] = num(v); src[a.k] = 'Account overview'; }
  for (const a of AN.filter(a => a.add)) if (auto[a.k] === undefined){
    let sum = 0, hit = false;
    for (const i of ins.filter(i => i !== overview)) for (const [k, v] of Object.entries(i.metrics || {})) if (a.re.test(k.trim()) && Number.isFinite(num(v))){ sum += num(v); hit = true; }
    if (hit){ auto[a.k] = sum; src[a.k] = 'added up from tracked posts and ads'; }
  }
  const f = folSorted(c), start = [...f].reverse().find(x => x.d < mk + '-01'), end = [...f].reverse().find(x => x.d.slice(0,7) <= mk);
  if (auto.newFollowers === undefined && start && end && end.d.slice(0,7) === mk){ auto.newFollowers = end.n - start.n; src.newFollowers = 'your follower log'; }
  const manual = repDoc(c, mk)?.stats || {}, val = {};
  for (const a of AN){ const m = manual[a.k]; if (m !== undefined && m !== '' && Number.isFinite(num(m))){ val[a.k] = num(m); src[a.k] = 'entered by you'; } else if (auto[a.k] !== undefined) val[a.k] = auto[a.k]; }
  const der = {};
  if (val.reached && (val.engaged || val.interactions)) der.engRate = (val.engaged || val.interactions) / val.reached * 100;
  if (val.adSpend && val.leads) der.cpl = val.adSpend / val.leads;
  return {val, auto, src, der, overview, ins, end};
}
function reportData(c, mk){
  const done = S.tasks.filter(t => t.client === c.id && t.status === 'done' && t.doneMonth === mk);
  const byKind = {}; done.forEach(t => { const k = SHORT[t.kind] || 'Other'; byKind[k] = (byKind[k] || 0) + 1; });
  const content = done.filter(t => CONTENT.includes(t.kind)).length;
  const cur = monthStats(c, mk), prev = monthStats(c, prevMonth(mk));
  const score = i => { for (const [k, v] of Object.entries(i.metrics || {})) if (/reach|views|plays/i.test(k) && Number.isFinite(num(v))) return num(v); return 0; };
  const top = cur.ins.filter(i => /post|reel|story/i.test(i.type)).map(i => ({title:i.title, s:score(i), learn:(i.learnings || [])[0] || ''})).filter(x => x.s).sort((a,b) => b.s - a.s).slice(0, 3);
  const f = folSorted(c), series = f.filter(x => x.d.slice(0,7) <= mk).slice(-12);
  return {done, byKind, content, target:target(c), cur, prev, top, series, followersNow:cur.end ? cur.end.n : null,
    learn:cur.ins.flatMap(i => i.learnings || []).slice(0, 4), next:eventsFor(c.id).filter(e => e.d.slice(0,7) > mk).slice(0, 3)};
}

const fmtV = (a, v) => v === undefined || v === null || !Number.isFinite(v) ? '—' : a.pct ? v.toFixed(v < 10 ? 1 : 0) + '%' : a.money ? CUR + fmtN(Math.round(v)) : (a.k === 'newFollowers' && v > 0 ? '+' : '') + fmtN(Math.round(v));

async function applyCc(x, chs){

    if (drops.has(t.itemIdx)){ await write(() => tasksCol().doc(t.id).delete()); continue; }
    const ni = map[t.itemIdx], it = out[ni]; if (!it) continue; const u = {};

}

/* ----- Client protection: health score (with its reasons), revenue share, days blocked, revisions ----- */
function health(c){
  let s = 100; const why = [];
  const bd = Number(c.billingDay);
  if (c.fee && bd && day > bd && c.paidMonth !== monthKey){ const d = day - bd, p = Math.min(30, d * 2); s -= p; why.push(`Payment ${d} day${d === 1 ? '' : 's'} late`); }
  const oldAsks = (c.asks || []).filter(x => x.status !== 'done' && daysSince(x.at) > 7).length;
  if (oldAsks){ s -= Math.min(20, oldAsks * 10); why.push(`${oldAsks} ask${oldAsks === 1 ? '' : 's'} unanswered over a week`); }
  const stuck = S.tasks.filter(t => t.client === c.id && t.status === 'sent' && t.statusAt?.sent && daysSince(t.statusAt.sent) > 3).length;
  if (stuck){ s -= Math.min(15, stuck * 5); why.push(`${stuck} approval${stuck === 1 ? '' : 's'} stuck 3+ days`); }
  const p = pace(c); if (p.cls === 'bad'){ s -= 15; why.push('Behind on posting'); } else if (p.cls === 'warn'){ s -= 7; why.push('Slightly behind on posting'); }
  const od = S.tasks.filter(t => t.client === c.id && isLate(t)).length; if (od){ s -= Math.min(15, od * 3); why.push(`${od} overdue`); }
  if (daysSince(lastInsightAt(c)) > 30){ s -= 10; why.push('No results tracked in 30 days'); }

}

  const out = {}; for (const [k, arr] of Object.entries(by)){ const tot = arr.reduce((a, x) => a + x[1], 0); for (const [c, f] of arr) out[c.id] = {pct:f / tot * 100, total:tot, cur:k}; }

      ${sec('How to do it', b.how)}${sec('What you need', b.need)}${sec('Check before you finish', b.check)}${sec('Avoid', b.avoid)}
      ${b.post && (b.post.when || b.post.caption || b.post.after) ? `<h4>Posting</h4><div class="bpost">${b.post.when ? `<div><span class="muted">When ·</span> ${esc(b.post.when)}</div>` : ''}${b.post.caption ? `<div><span class="muted">Caption angle ·</span> ${esc(b.post.caption)}</div>` : ''}${b.post.after ? `<div><span class="muted">After posting ·</span> ${esc(b.post.after)}</div>` : ''}</div>` : ''}

  return `<div class="etform" data-bf="${esc(t.id)}"><div class="row" style="justify-content:space-between"><div class="lab" style="margin:0">Brief${c ? ' · ' + esc(c.name) : ''}</div>

}
function writeBrief(t){
  const c = C(t.client); if (!c || !sample) return;
  const k = 'brief:' + t.id, x = t.campaign ? S.campaigns.find(q => q.id === t.campaign) : null, it = x?.items?.[t.itemIdx];
  const todo = t.todo ? todoOf(t.client, t.todo) : null;
  const info = {task:t.title, type:BRIEF_KINDS[t.kind] || t.kind, due:t.due || '', today, assignedTo:M(t.assignee)?.name || 'unassigned', status:STATUS[t.status], priority:t.priority || '',
    yourNote:todo?.text || '', comments:(t.comments || []).slice(-3).map(m => m.text),
    campaignPiece:it ? {campaign:x.name, phase:it.phase, format:CH[it.channel], hook:it.hook, copy:it.copy, visual:it.visual, askClientFor:it.need} : null};
  run(k, async () => {
    const r = await sample.json(`${pre(c)}\n\nYou are the head of delivery at Reach Theory. Write a practical work brief a team member can follow without asking anything, for this task for ${c.name}. Never write one line: be concrete and complete. Plain English, short sentences. Any caption, hook or on-screen text you suggest is in the client's language (${c.brand?.language || c.lang || 'English'}). Never suggest filming or shooting: we edit clips the client sends, and for Eroe we generate AI images. ${t.kind === 'reel' ? 'For a reel, include exact edit specs: length, first 3 seconds, text on screen, subtitles, music mood, cover frame, export 9:16 1080x1920. ' : ''}${t.kind === 'carousel' ? 'For a carousel, say what each slide holds and the slide order. ' : ''}${t.kind === 'ai' || t.kind === 'post' ? 'Include a step that says to press Make prompt on this task, pick the AI tool and generate the image from that prompt. ' : ''}${t.kind === 'reel' ? 'Include a step that says to press Make prompt on this task to get the edit brief. ' : ''}Respect the festival dates in the rules.${shradhNote()}\n\nTask: ${JSON.stringify(info)}\nClient: ${JSON.stringify(clientContext(c, {insights:4}))}\n\nReply with only JSON: {"what": "3 to 4 sentences: what the task is, why it matters for this client right now, and who it is for", "outcome": "what the finished result looks like, one or two sentences", "steps": [6 to 10 objects {"t": "one clear action with specifics", "who": "Owner" | "Editor" | "Panda" | "Client", "mins": number}], "how": [5 to 8 specifics about how to do it: format, size, length, wording, tools, settings, examples], "need": [what we need and from whom, with the message to ask the client in one line where relevant], "check": [4 to 6 quality checks before sending or posting], "avoid": [2 to 4 common mistakes for this task], "post": {"when": "best day and time to post or send, from the client's audience and activity, or empty if not content", "caption": "caption or message angle in one or two lines, or empty", "after": "what to do after it goes live: replies, DMs, saving the numbers, or empty"}, "mins": total minutes as a number}`, {cache:false});
    if (!r || !r.what || !Array.isArray(r.steps) || !r.steps.length) throw {code:'invalid_json'};
    const arr = a => (Array.isArray(a) ? a : []).map(String).filter(Boolean).slice(0, 10);
    const brief = {what:String(r.what), outcome:String(r.outcome || ''), steps:r.steps.slice(0, 12).map(o => typeof o === 'string' ? {t:o, done:false} : {t:String(o.t || ''), who:String(o.who || ''), mins:Number(o.mins) || 0, done:false}).filter(o => o.t),
      how:arr(r.how), need:arr(r.need), check:arr(r.check), avoid:arr(r.avoid), post:r.post && typeof r.post === 'object' ? {when:String(r.post.when || ''), caption:String(r.post.caption || ''), after:String(r.post.after || '')} : null, mins:Number(r.mins) || 0, at:Date.now()};
    await write(() => tasksCol().doc(t.id).update({brief}));
  });
}

function promptPanel(t){

        ${sample && g ? `<button class="lnk" data-act="tpAgain" ${ui.busy[k] ? 'disabled' : ''}>Write again</button>` : ''}<button class="lnk" data-act="tpClose">Close</button></div></div>
    ${sample && !g && !live && !ui.busy[k] ? `<div class="row"><button class="b pri" data-act="tpAgain">${what === 'edit' ? 'Write edit brief' : 'Write prompt'}</button><span class="muted" style="font-size:12px">${what === 'edit' ? 'Built from the clips the client sends.' : 'Pick the tool first. The prompt is written for it.'}</span></div>` : ''}
    ${ui.out[k] ? `<p class="late" style="font-size:13px;margin:0">${esc(ui.out[k])}</p>` : ''}
    ${items.map((x, i) => `<div class="tpi"><div class="row" style="justify-content:space-between"><b style="font-weight:600;font-size:13.5px">${esc(x.title || 'Prompt')}</b>${x.saved ? '<span class="pill good">Saved</span>' : g && !live ? '<button class="lnk" data-act="tpSave" data-i="' + i + '">Save to library</button>' : ''}</div>
      <div class="out" id="tp-${esc(t.id)}-${i}">${esc(x.prompt)}</div>
      ${x.negative ? `<p class="muted" style="margin:0;font-size:13px"><b style="font-weight:500">Avoid:</b> ${esc(x.negative)}</p>` : ''}${x.settings ? `<p class="muted" style="margin:0;font-size:13px"><b style="font-weight:500">Settings:</b> ${esc(x.settings)}</p>` : ''}
      <div class="row"><button class="lnk" data-act="copy" data-src="tp-${esc(t.id)}-${i}">Copy prompt</button>${hfOk(what) && g && !live ? hfButton(t, i) : ''}</div>${hfResults(t, i)}</div>`).join('')}
    ${ui.busy[k] ? progress(k) : !items.length && !ui.out[k] && !sample ? '<p class="empty" style="margin:0">No prompt written yet.</p>' : ''}</div>`;
}
function writeTaskPrompt(t){
  const c = C(t.client); if (!c || !sample) return;
  const k = 'tprompt:' + t.id, {what, ratio} = tpKind(t), tool = keep('tp-tool-' + t.id, t.gen?.tool || lastTool()), n = what === 'carousel' ? 6 : 1;
  const x = t.campaign ? S.campaigns.find(q => q.id === t.campaign) : null, it = x?.items?.[t.itemIdx];
  const piece = it ? {campaign:x.name, hook:it.hook, copy:it.copy, visualIdea:it.visual, channel:CH[it.channel]} : null;
  try { localStorage.setItem('rsd-tool', tool); } catch(e){}
  ui.tpOpen[t.id] = true; ui.tpLive[t.id] = [];
  run(k, async () => {
    const lite = {name:c.name, business:c.tag, city:c.city, language:c.brand?.language, brand:c.brand, pillars:c.plan?.pillars, focus:c.plan?.focus, recentLearnings:clientInsights(c.id).slice(0, 4).flatMap(i => i.learnings || []).slice(0, 6)};
    const got = await streamItems(`${pre(c)}\n\nYou are the creative director for ${c.name}. Write ${n === 1 ? 'one' : n} ${what === 'edit' ? 'edit brief' : 'prompt'}${n === 1 ? '' : 's'} for this task: "${t.title}". Type: ${P_WHAT[what]}. Format ${ratio}.\n${P_GUIDE[what]}\n${what === 'edit' ? '' : P_TOOLTIPS[tool] + ' Keep products realistic and accurate (jewellery details, garment seams, wheel spokes, fabric texture). Match the brand kit look, and follow brand.identity exactly when it is set (layout, wordmark placement, setting, light, palette, model styling, type). Local clients are in Khanna, Punjab: settings, people and styling should feel Punjabi and real, never generic stock.'}\n${piece ? 'Campaign piece this task belongs to (stay consistent with it): ' + JSON.stringify(piece) + '\n' : ''}Client:\n${JSON.stringify(lite)}\n\nEach item: {"title": short name, "prompt": the full ready-to-paste prompt or brief (keep newlines out: use spaces or " / "), "negative": what to avoid (or ""), "settings": aspect ratio / duration / tool settings (or ""), "use": where it is used}.`, k, o => { if (!o || !o.prompt) return false; ui.tpLive[t.id].push({title:String(o.title || ''), prompt:String(o.prompt), negative:String(o.negative || ''), settings:String(o.settings || ''), use:String(o.use || '')}); });
    if (!got) throw {code:'invalid_json'};
    const gen = {what, tool, ratio, items:ui.tpLive[t.id].slice(0, 8), at:Date.now()};

}

async function saveTaskEdit(t, f){
  const g = id => (document.getElementById(`et-${id}-${t.id}`)?.value ?? '').trim();
  const title = g('title'); if (!title) return;

const APPROVE_RE = /^(✅|👍|👌|🙏|ok+|okay|ok ji|okk|approved?|done|yes|ha+n?|haanji|ji|theek|thik|theek hai|thik hai|vadiya|vadia|badhiya|bdia|perfect|good|nice|fine|final|sahi|chalega|go ahead)([\s!.✅👍👌🙏]*(ji|hai|aa|a|h|ae|ne)?)*[\s!.✅👍👌🙏]*$/i;

  const ready = S.tasks.filter(t => t.client === c.id && t.status === 'review').sort((a, b) => (a.due || '9').localeCompare(b.due || '9'));

}
function packText(c, ready, need){

  ready.forEach((t, i) => { const p = t.post || {};
    L.push(`*${i + 1}. ${splitTitle(t.title)[0]}*${t.due ? ' · goes live ' + fmt(t.due) : ''}`);
    if (p.link) L.push(p.link);
    if (p.caption) L.push(p.caption.trim());

// "1 ✅ 2 change colour", "1,2 ok", "all ok", or one item per line. Lines without a number add to the item before them.
function parseReply(text, n){
  const out = {}, src = String(text || '').trim(); if (!src) return out;
  if (!/\d/.test(src) && (APPROVE_RE.test(src) || (ALL_RE.test(src) && /ok|✅|👍|approve|theek|thik|vadiya|done|final|good/i.test(src)))){ for (let i = 1; i <= n; i++) out[i] = {ok:true, note:''}; return out; }
  const parts = src.split(/\n+|(?=(?:^|\s)#?\d{1,2}\s*(?:[.):\-–]|\s|✅|👍|$))/).map(s => s.trim()).filter(Boolean);
  let last = null;
  for (const p of parts){
    const m = p.match(/^#?(\d{1,2}(?:\s*(?:,|&|\+|and|aur|te)\s*#?\d{1,2})*)\s*[.):\-–]*\s*([\s\S]*)$/i);
    const nums = m ? m[1].split(/\D+/).map(Number).filter(x => x >= 1 && x <= n) : [];
    if (m && nums.length){ const rest = m[2].trim();

      last = nums.at(-1); }
    else if (last && out[last]){ out[last] = {ok:false, note:[out[last].note, p].filter(Boolean).join(' ')}; }
  }
  return out;
}

  else if (k === 'plan'){ const ok = await savePlanVersion(c, {target:{count:Math.max(0, Number(v('p-count')) || 0)}, plan:{goal:v('p-goal'), audience:v('p-aud'), focus:v('p-focus'), pillars:v('p-pil').split(',').map(s => s.trim()).filter(Boolean)}}, 'Edited by hand'); if (ok){ ui.editing = null; render(); } }
  else if (k === 'insight') readInsight(c);
  else if (k === 'chat'){ const t = v('chat-' + c.id); if (t && sample && !ui.busy['chat:' + c.id]) chat(c, t); }
  else if (k === 'prompts'){ if (sample) makePrompts(c); }
  else if (k === 'write'){ ui.keep['w-mode'] = v('w-mode'); writeFor(c, v('w-mode'), v('w-brief')); }
  else if (k === 'ads') await upd(c.id, {ads:{budget:v('a-budget'), status:v('a-status')}}, 'Saved');
  else if (k === 'adNotes'){ if (await upd(c.id, {ads:{notes:v('a-notes')}}, 'Notes saved')) delete ui.keep['a-notes-' + c.id]; }
  else if (k === 'brand') await upd(c.id, {brand:{identity:v('b-ident'), tone:v('b-tone'), language:v('b-lang'), look:v('b-look'), always:v('b-do'), never:v('b-dont'), tags:v('b-tags')}}, 'Brand kit saved');
  else if (k === 'seo'){ const kws = (c.seo?.keywords || []).map((x, n) => { const rank = v('kr-' + n); return {kw:v('kw-' + n), page:v('kp-' + n), rank, prev: rank !== (x.rank || '') && x.rank ? x.rank : (x.prev || '')}; }).filter(x => x.kw); await upd(c.id, {seo:{keywords:kws}}, 'Rankings saved'); }
  else if (k === 'comp'){ const n = v('cp-n'); if (!n) return; await upd(c.id, {competitors:[...(c.competitors || []), {name:n, note:v('cp-note')}]}, 'Added'); }
  else if (k === 'member'){ const n = v('m-name'); if (!n) return; await write(() => db.collection('team').add({name:n, role:v('m-role'), createdAt:Date.now()}), 'Member added'); }
});
$('#filePick').addEventListener('change', e => { e.target.accept = 'image/png,image/jpeg,image/webp,image/gif';
  if (String(ui.pickTarget || '').startsWith('audit:')){ const p = (S.pipeline || []).find(q => q.id === ui.pickTarget.slice(6)), fs = [...e.target.files].filter(f => /^image\//.test(f.type)); ui.pickTarget = ''; e.target.value = '';
    if (p && fs.length) auditRun(p, fs); else if (p) toast('Pick screenshots of their profile and posts.'); return; }
  if (String(ui.pickTarget || '').startsWith('qc:')){ const t = S.tasks.find(q => q.id === ui.pickTarget.slice(3)), f = e.target.files[0]; ui.pickTarget = ''; e.target.multiple = true; e.target.value = '';
    if (t && f){ if (!/^image\//.test(f.type)) toast('Pick an image file (PNG or JPG).'); else qcRun(t, f); } return; } if (ui.pickTarget === 'restore'){ if (e.target.files[0]) readBackupFile(e.target.files[0]); ui.pickTarget = ''; e.target.value = ''; return; } if (ui.pickTarget === 'ask') addAskPending(e.target.files); else addPending(e.target.files); ui.pickTarget = ''; e.target.value = ''; });
function addAskPending(files){ const imgs = [...files].filter(f => /^image\//.test(f.type)); if (!imgs.length || !ui.cid) return; if (!assets){ toast('Images can’t be stored in this view.'); return; } const arr = ui.askPend[ui.cid] = ui.askPend[ui.cid] || []; for (const f of imgs.slice(0, 6 - arr.length)) arr.push({file:f, url:URL.createObjectURL(f)}); render(); }
document.addEventListener('paste', e => {
  if (!(ui.view === 'client' && (ui.ctab === 'insights' || ui.ctab === 'overview'))) return;
  const files = [...(e.clipboardData?.files || [])].filter(f => /^image\//.test(f.type));
  if (files.length){ e.preventDefault(); ui.ctab === 'insights' ? addPending(files) : addAskPending(files); }
});
document.addEventListener('dragstart', e => { const cd = e.target.closest && e.target.closest('.card[data-tid]'); if (cd){ e.dataTransfer.setData('text/plain', cd.dataset.tid); e.dataTransfer.effectAllowed = 'move'; cd.classList.add('dragging'); } });
document.addEventListener('dragend', e => { document.querySelectorAll('.dragging,.col.over').forEach(x => x.classList.remove('dragging', 'over')); });
document.addEventListener('dragover', e => { const col = e.target.closest && e.target.closest('.col[data-col]'); if (col){ e.preventDefault(); document.querySelectorAll('.col.over').forEach(x => x !== col && x.classList.remove('over')); col.classList.add('over'); } });
document.addEventListener('drop', async e => { const col = e.target.closest && e.target.closest('.col[data-col]'); if (!col) return; e.preventDefault(); col.classList.remove('over');
  const tid = e.dataTransfer.getData('text/plain'), t = S.tasks.find(x => x.id === tid); if (!t || t.status === col.dataset.col) return;
  await write(() => tasksCol().doc(tid).update({status:col.dataset.col, doneMonth: col.dataset.col === 'done' ? monthKey : '', doneAt: col.dataset.col === 'done' ? Date.now() : 0, statusAt:{[col.dataset.col]:Date.now()}}), 'Moved to ' + STATUS[col.dataset.col]); });
document.addEventListener('dragover', e => { const z = e.target.closest && e.target.closest('#askzone'); if (z && e.dataTransfer?.types?.includes('Files')){ e.preventDefault(); z.classList.add('dropon'); } });
document.addEventListener('dragleave', e => { const z = e.target.closest && e.target.closest('#askzone'); if (z && !z.contains(e.relatedTarget)) z.classList.remove('dropon'); });
document.addEventListener('drop', e => { const z = e.target.closest && e.target.closest('#askzone'); if (z && e.dataTransfer?.files?.length){ e.preventDefault(); z.classList.remove('dropon'); addAskPending(e.dataTransfer.files); } });
document.addEventListener('dragover', e => { const d = e.target.closest && e.target.closest('#drop'); if (d){ e.preventDefault(); d.classList.add('on'); } });
document.addEventListener('dragleave', e => { const d = e.target.closest && e.target.closest('#drop'); if (d) d.classList.remove('on'); });
document.addEventListener('drop', e => { const d = e.target.closest && e.target.closest('#drop'); if (d){ e.preventDefault(); addPending(e.dataTransfer.files); } });

/* ---------- boot ---------- */
function listen(name, sort){
  db.collection(name).onSnapshot(snap => {
    S[name] = snap.docs.map(d => ({id:d.id, ...d.data()}));
    if (sort) S[name].sort(sort);
    if (name === 'clients'){ S.allClients = S.clients; S.clients = S.allClients.filter(c => c.status !== 'archived'); }
    loaded[name] = true; if (S.loadErr) delete S.loadErr[name]; schedule();
    if (name === 'tasks' || name === 'clients') todoSweep();
    if (name === 'tasks'){ rollSoft(); runRoutines(); }
    if (name === 'clients') runRoutines();
  }, e => { loaded[name] = true; S.loadErr[name] = (e && e.code) || 'unavailable'; schedule(); });
}
async function boot(){
  try { const cp = localStorage.getItem('rsd-cap'); if (CAPS[cp]) ui.cap = cp; } catch(e){}
  try { const gb = localStorage.getItem('rsd-gb'); if (['client','due','person'].includes(gb)) ui.groupBy = gb; } catch(e){}
  try { userNs = await claude.use('user'); } catch(e){}
  try { db = await claude.use('db'); } catch(e){}
  if (!db){ $('#main').innerHTML = '<h1>Reach Theory Desk</h1><p class="sub">Sign in to Claude to open your desk.</p>'; return; }
  if (userNs){
    try { role = (await userNs.canEdit()) ? 'admin' : 'editor'; } catch(e){}
    try { myUid = await userNs.id(); } catch(e){}
  }
  listen('tasks'); listen('team', (a,b) => (a.createdAt||0) - (b.createdAt||0));
  if (myUid){ try { const p = await db.doc(`data/users/${myUid}/profile`).get(); if (p.exists) myMember = p.data().member; } catch(e){} }
  if (role === 'editor'){ render(); return; }
  listen('clients', (a,b) => (a.order ?? 99) - (b.order ?? 99));
  listen('insights');
  listen('prompts');
  listen('reports');
  listen('invoices');
  db.doc('meta/studio').onSnapshot(sn => { S.studio = sn.exists ? sn.data() : {}; schedule(); }, () => {});
  db.doc('meta/backup').onSnapshot(sn => { S.backup = sn.exists ? sn.data() : null; schedule(); }, () => {});
  db.doc('meta/focus').onSnapshot(sn => { S.focus = sn.exists ? sn.data() : null; schedule(); }, () => {});
  db.doc('meta/pace').onSnapshot(sn => { S.pace = sn.exists ? sn.data() : null; schedule(); }, () => {});
  db.doc('meta/pipeline').onSnapshot(sn => { S.pipeline = sn.exists ? (sn.data().items || []) : []; schedule(); }, () => {});
  db.doc('meta/routines').onSnapshot(sn => { S.routines = sn.exists ? (sn.data().items || []) : []; S.routinesLoaded = true; schedule(); runRoutines(); }, () => {});
  db.doc('meta/rules').onSnapshot(sn => { S.rules = sn.exists ? (sn.data().rules || []) : []; buildPreamble(); schedule(); }, () => {});
  db.doc('meta/calendar').onSnapshot(sn => { S.customEvents = sn.exists ? (sn.data().events || []) : []; setEvents(S.customEvents); schedule(); }, () => {});
  listen('campaigns', (a,b) => (b.createdAt||0) - (a.createdAt||0));
  render();
  try { sample = await claude.use('sample'); } catch(e){}
  if (sample){ try { const l = await sample.limits(); canImages = !!l.images; maxImages = l.images ? l.images.maxCount : 0; canTools = !!l.tools; } catch(e){} }
  try { assets = await claude.use('assets'); } catch(e){}
  try { downloads = await claude.use('downloads'); } catch(e){}
  try { mcp = await claude.use('mcp'); } catch(e){}
  setTimeout(() => autoMeta(), 4000);   // after the client list has loaded
  render();
}
if (window.claude) boot(); else $('#main').innerHTML = '<h1>Reach Theory Desk</h1><p class="sub">Open this page from Claude to load your desk.</p>';
</script>
